example = '{"panel": "training"}'

["app.command_palette"]
summary = "Opens or closes the command palette, which finds and runs any action by name."
kind = "view"
returns = "nothing"

["view.ui_scale"]
summary = "Sets the UI scale, 0.5 to 3, on top of the display's."
