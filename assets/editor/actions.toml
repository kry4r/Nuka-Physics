returns = "{focus}"

["scene.add_capsule"]
summary = "Adds a capsule above the selection, else above the origin, as one undoable edit; scene.spawn with kind capsule."
kind = "edit"
returns = "{focus}"

["scene.add_cylinder"]
summary = "Adds a cylinder above the selection, else above the origin, as one undoable edit; scene.spawn with kind cylinder."
kind = "edit"
returns = "{focus}"

["scene.add_plane"]
summary = "Adds a plane as one undoable edit; scene.spawn with kind plane."
kind = "edit"
returns = "{focus}"

["window.layout_authoring"]
