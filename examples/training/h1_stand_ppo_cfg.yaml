# rl_games PPO config for Nuka H1 reduced-DOF torque standing (S4 phase 1).
#
# Locked contract:
#   env_name: nuka_h1_stand
#   obs:      32-wide bridge_export.py layout (no go2_obs normalization/layout)
#   action:   10 normalized torques, per-joint scaled to H1 MJCF limits by env
#             [200,200,200,300,40] per leg.
#
# This intentionally keeps the Go2 anti-collapse settings that matter to rl_games:
# unit action bounds, entropy, adaptive KL, value bootstrap, normalized input/value,
# and short smoke overrides through train_h1_stand_ppo.py --smoke.
params:
  seed: 1

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: h1_stand
    full_experiment_name: h1_stand
    env_name: nuka_h1_stand
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 100
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    num_actors: 4096
    minibatch_size: 24576
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0001

    env_config:
      dt: 0.005
      decimation: 4
      episode_length_s: 20.0
      termination_height: 0.55
      termination_tilt_deg: 60.0
