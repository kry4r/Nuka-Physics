# Zone-balanced curriculum for the full Go2 corridor. All starts share one
# absolute finish so later obstacles produce early success samples.
params:
  seed: 11

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: go2_corridor_teacher_v3_curriculum
    full_experiment_name: go2_corridor_teacher_v3_curriculum
    env_name: nuka_go2_corridor_teacher
    multi_gpu: False
    mixed_precision: False
    normalize_input: False
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    clip_actions: False
    nuka_go2_prior_adapter_only: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 1.0e-3
    lr_schedule: constant
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 400
    save_best_after: 20
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.1
    horizon_length: 24
    num_actors: 1024
    minibatch_size: 6144
    mini_epochs: 2
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0

    env_config:
      scene: examples/scenes/corridor_go2.nks
      command: [0.5, 0.0, 0.0]
      fixed_command: True
      enable_contact_rewards: false
      termination_height: 0.18
      termination_tilt_deg: 120.0
      episode_length_s: 20.0
      spawn_x_windows: [[-0.55, -0.35, 0.30], [0.14, 0.22, 0.15], [0.85, 1.05, 0.20], [2.15, 2.35, 0.20], [3.35, 3.55, 0.15]]
      forward_progress_scale: 15.0
      progress_milestones: [0.35, 0.65, 1.2, 1.8]
      progress_milestone_bonus: 2.0
      success_x: 4.10
      success_progress_m: 0.0
      success_bonus: 100.0
      fall_penalty: 20.0
