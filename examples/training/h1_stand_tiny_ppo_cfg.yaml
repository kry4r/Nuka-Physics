# rl_games PPO config for H1 standing with deploy-matched tiny actor.
#
# Actor/critic hidden units are [64,64] with tanh activation, matching the C++
# tiny_mlp bridge shape. This avoids a lossy post-hoc distillation step.
params:
  seed: 1

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [64, 64]
      activation: tanh
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: h1_stand_tiny
    full_experiment_name: h1_stand_tiny
    env_name: nuka_h1_stand
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 100
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    num_actors: 4096
    minibatch_size: 24576
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0001

    env_config:
      dt: 0.005
      decimation: 4
      episode_length_s: 20.0
      termination_height: 0.55
      termination_tilt_deg: 60.0
      termination_qvel: 500.0
