# Stage A: the panel is temporarily authored high.  Preserve the ep8 policy
# exactly through the MPM bed, then train only the slab-gate adapter on the real
# full-start debris exit state until the robot can recover laterally to x=3.9 m.
params:
  seed: 47
  algo: {name: a2c_continuous}
  model: {name: continuous_a2c_logstd}
  network:
    name: actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init: {name: default}
        sigma_init: {name: const_initializer, val: -4.0}
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer: {name: default}
      regularizer: {name: None}
  config:
    name: go2_corridor_teacher_v16_post_debris_recovery
    full_experiment_name: go2_corridor_teacher_v16_post_debris_recovery
    env_name: nuka_go2_corridor_teacher
    multi_gpu: False
    mixed_precision: False
    normalize_input: False
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    clip_actions: False
    nuka_go2_prior_adapter_only: False
    nuka_go2_actor_head_only: False
    nuka_go2_last_obs_adapter_only: True
    nuka_go2_freeze_sigma: True
    reward_shaper: {scale_value: 1.0}
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: constant
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 60
    save_best_after: 5
    save_frequency: 5
    grad_norm: 0.25
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.05
    horizon_length: 48
    num_actors: 64
    minibatch_size: 768
    mini_epochs: 1
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0
    env_config:
      scene: examples/scenes/go2_oneshot_training_coarse.nks
      use_scene_builder: true
      scene_build_kwargs: {bake_link_sdf: true}
      command: [0.50, 0.0, 0.0]
      fixed_command: True
      enable_contact_rewards: false
      slab_gate_obs: true
      termination_height: 0.18
      termination_tilt_deg: 65.0
      episode_length_s: 18.0
      spawn_x_windows: [[-0.47, -0.43, 0.90], [2.75, 2.95, 0.10]]
      time_penalty: 0.08
      forward_progress_scale: 100.0
      lateral_position_penalty_scale: 20.0
      lateral_velocity_penalty_scale: 10.0
      progress_milestones: [0.15, 0.30, 0.45, 0.60, 0.75, 0.90, 1.10, 1.30, 1.50, 1.70, 1.90, 2.10, 2.30, 2.50, 2.70, 2.90, 3.10, 3.30, 3.50, 3.70, 3.90, 4.10, 4.30]
      progress_milestone_bonus: 14.0
      success_x: 3.90
      success_progress_m: 0.0
      success_bonus: 1200.0
      fall_penalty: 200.0
