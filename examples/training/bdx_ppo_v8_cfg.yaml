# rl_games (1.6.5) PPO config for the Nuka BDX (open_duck_mini_v2) flat walk.
#
# Same PPO recipe family as the Go2 locomotion config (init_noise_std 1.0,
# [512,256,128] elu actor/critic, entropy 0, adaptive lr, only-positive reward
# floor). The env is the 14-DOF duck driven on 10 leg joints (head PD-held), obs 44
# (incl. gait phase clock), action 10; nuka.rl_games adapter (env_name: nuka_bdx).
#
# ``num_actors`` / ``max_epochs`` / ``minibatch_size`` are overridden by
# train_go2_ppo.py (esp. for --smoke). Reward weights + command ranges live under
# config.env_config and are read by BdxWalkEnv (no recompile to retune).
params:
  seed: 1

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: bdx_walk_v8
    full_experiment_name: bdx_walk_v8
    env_name: nuka_bdx
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 100
    grad_norm: 1.0
    # entropy_coef 0: with fixed_sigma + clip_actions an entropy bonus pays for
    # unbounded sigma growth once samples saturate at +-1 (observed 22->89 runaway,
    # reward 205->75, bang-bang actions); PPO's learned sigma explores fine without it.
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    num_actors: 4096
    minibatch_size: 24576
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.005

    env_config:
      dt: 0.005
      decimation: 4
      # 30 s episodes with the command held for the WHOLE episode: the task is a
      # SUSTAINED walk (the earlier 10 s resample never demanded one, and the
      # deterministic policy fell within any continuous 20 s walk).
      episode_length_s: 30.0
      resample_time_s: 30.0
      termination_height: 0.10
      termination_tilt_deg: 60.0
      # Initial command (immediately overwritten by the first resample). Ranges =
      # the Playground joystick training domain; fixed_command pins them (eval).
      command: [0.15, 0.0, 0.0]
      fixed_command: false
      # Playground push_config (default-on there): random horizontal velocity
      # kicks force step-out recoveries all episode long.
      push_enable: true
      # lin_vel_x reaches the 0.22 reference bin so the gait learns longer strides
      # and real forward speed (the earlier 0.15 cap left the duck creeping).
      command_ranges:
        lin_vel_x: [-0.15, 0.22]
        lin_vel_y: [-0.2, 0.2]
        ang_vel_yaw: [-1.0, 1.0]
      # The Open Duck Playground imitation reward system, whole and unmixed:
      # shared tracking sigma 0.01, alive 20, imitation 1.0 (its internal
      # w_joint_pos=15 anchors the polynomial reference gait -- the
      # lateral-balance step rhythm this ankle-roll-less biped cannot discover
      # free-gait, and the stepping pressure that defeats the stand-still basin).
      sigma_lin: 0.01
      sigma_ang: 0.01
      reward_scales:
        tracking_lin_vel: 5.0
        tracking_ang_vel: 6.0
        torques: -1.0e-3
        action_rate: -0.3
        stand_still: -0.2
        alive: 20.0
        imitation: 1.0
