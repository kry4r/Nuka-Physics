# Go2 privileged-teacher PPO on the canonical one-shot corridor.
#
# The go2_ppo flat recipe (PPO hyperparameters + [512,256,128] elu network) with
# the env swapped to the corridor teacher: 48-d proprio + a parsed centre-line
# height profile (trunk clearance + 16 forward step-height deltas), start-window
# spawn curriculum, and the corridor progress / success shaping (values shared with
# the BDX teacher). No camera; a plain rl_games MLP over the flat 65-d vector.
params:
  seed: 11

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: go2_corridor_teacher_v1
    full_experiment_name: go2_corridor_teacher_v1
    env_name: nuka_go2_corridor_teacher
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 100
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    num_actors: 1024
    minibatch_size: 6144
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0001

    env_config:
      scene: examples/scenes/corridor_go2.nks
      # Fixed cruise command; the corridor is a yaw-0 forward traverse.
      command: [0.4, 0.0, 0.0]
      fixed_command: True
      # Absolute base-height kill (corridor drop is only 0.10 m; the stand is 0.28).
      termination_height: 0.25
      termination_tilt_deg: 60.0
      episode_length_s: 20.0
      # Reverse curriculum: platform / on-tread / past-both-steps spawn windows.
      spawn_x_windows: [[-0.32, -0.12, 0.4], [0.14, 0.22, 0.3], [0.30, 0.60, 0.3]]
      # Reward progress relative to each randomized spawn (not absolute scene x).
      forward_progress_scale: 15.0
      progress_milestones: [0.35, 0.65, 1.2]
      progress_milestone_bonus: 2.0
      # Reaching the goal is a successful termination, relative to each spawn.
      success_progress_m: 1.2
      success_bonus: 100.0
      fall_penalty: 20.0
