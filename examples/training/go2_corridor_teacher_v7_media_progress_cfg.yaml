# Low-variance media continuation with corridor-dominant progress shaping.  A
# small per-step cost removes the post-curtain standing optimum; dense monotonic
# milestones guide recovery through the gravel/debris zones.
params:
  seed: 11
  algo: {name: a2c_continuous}
  model: {name: continuous_a2c_logstd}
  network:
    name: actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init: {name: default}
        sigma_init: {name: const_initializer, val: -4.0}
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer: {name: default}
      regularizer: {name: None}
  config:
    name: go2_corridor_teacher_v7_media_progress
    full_experiment_name: go2_corridor_teacher_v7_media_progress
    env_name: nuka_go2_corridor_teacher
    multi_gpu: False
    mixed_precision: False
    normalize_input: False
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    clip_actions: False
    nuka_go2_prior_adapter_only: False
    nuka_go2_freeze_sigma: True
    reward_shaper: {scale_value: 1.0}
    gamma: 0.99
    tau: 0.95
    learning_rate: 1.0e-6
    lr_schedule: constant
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 300
    save_best_after: 8
    save_frequency: 20
    grad_norm: 0.5
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.05
    horizon_length: 48
    num_actors: 64
    minibatch_size: 768
    mini_epochs: 1
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0
    env_config:
      scene: examples/scenes/go2_oneshot_training_coarse.nks
      use_scene_builder: true
      scene_build_kwargs: {bake_link_sdf: true}
      command: [0.50, 0.0, 0.0]
      fixed_command: True
      enable_contact_rewards: false
      termination_height: 0.08
      termination_tilt_deg: 120.0
      episode_length_s: 24.0
      spawn_x_range: [-0.47, -0.43]
      time_penalty: 0.04
      forward_progress_scale: 100.0
      progress_milestones: [0.35, 0.65, 0.9, 1.05, 1.2, 1.4, 1.6, 1.8, 2.0, 2.2, 2.4, 2.6, 2.8, 3.0, 3.2, 3.4, 3.6, 3.8, 4.1, 4.3]
      progress_milestone_bonus: 10.0
      success_x: 3.90
      success_progress_m: 0.0
      success_bonus: 500.0
      fall_penalty: 20.0
