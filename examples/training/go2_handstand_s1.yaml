# rl_games (1.6.5) PPO config for the Nuka Go2 rear-leg HANDSTAND (倒立).
#
# Inverted static-balance skill on the SAME Go2 floating-base flat scene the
# walker uses (go2_locomotion.usda) -- PD-position control, NO T1/torque
# dependency (the go2_handstand_probe.py PD-AUTHORITY PASS: PD reaches a full 90
# deg handstand under the real 23.7/35.55 N.m force limit with ~0.01x torque
# demand; closed-loop balance is the RL problem). Full design:
# subagent-plans/2026-06-15-skill-spec-handstand.md.
#
# Hyperparameters inherited from go2_ppo_cfg.yaml (the proven legged_gym/rsl_rl
# Go2 recipe): net [512,256,128] elu, entropy_coef=0.01, lr 1e-3 adaptive,
# kl_threshold 0.01, gamma 0.99, tau 0.95, horizon 24, mini_epochs 5. Only the
# env_name, env_config (handstand stage + reward), num_actors, and minibatch
# differ.
#
# COLD START: a 48/49-dim pitch-conditioned handstand policy has no locomotion
# warm-start (the walker is 48-dim, a different objective). The anti-collapse
# contract is preserved: action space +-1 (go2_obs.ACTION_SPACE_LIMIT) so
# rl_games' rescale is the identity; the reward has a +0.25 alive floor + a
# dominant +1.5 orientation term + a per-env theta_cmd curriculum so each stage
# hands the policy a climbable gradient (spec Section 5.5).
#
# STAGED TRAINING (env_config.stage): S0 REACH (0->45deg, IC flat) -> S1 REAR-UP
# (45->75deg, IC pitched) -> S2 HOLD (->90deg, IC near-handstand). Each stage
# warm-starts the next via --checkpoint. The obs APPENDS the normalized theta_cmd
# (theta_cmd_obs: true => obs 48 -> 49) so ONE pitch-conditioned net spans the
# ramp. Switch stage per run with the train_go2_ppo.py --cfg + an env_config
# override, OR edit env_config.stage here per stage launch (see the staged
# command in the subagent report).
#
# num_actors 2048 (GPU coexistence -- leave the other GPU job room); train on
# GPU1 (CUDA_VISIBLE_DEVICES=1). minibatch = horizon*num_actors/4 = 24*2048/4
# = 12288.
params:
  seed: 1

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: go2_handstand
    full_experiment_name: go2_handstand
    env_name: nuka_go2_handstand
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 100
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    num_actors: 2048
    minibatch_size: 12288
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.01

    env_config:
      # Handstand stage (the per-env theta_cmd pitch-target curriculum band + the
      # IC pose). S0 REACH | S1 REAR-UP | S2 HOLD. Edit per staged launch (or
      # override via a per-stage cfg copy). Default S0 (cold-start REACH).
      stage: S1
      # Option A: append the normalized theta_cmd to the 48-dim obs (obs -> 49) so
      # the policy is pitch-conditioned and one net spans S0->S2. KEEP CONSISTENT
      # across stages (the warm-start chain restores a 49-dim net).
      theta_cmd_obs: true
      reward_mode: handstand

      # The handstand uses NO velocity command (pinned to 0, fixed) and NO terrain
      # (flat scene). The tilt-kill is INVERTED in the env (vertical is the GOAL),
      # so termination_tilt_deg below is NEVER consulted (the env does not call the
      # base tilt-kill) -- left here only for documentation. termination_height is
      # likewise replaced by the env's low collapse floor (base_z < 0.10).
      command: [0.0, 0.0, 0.0]
      fixed_command: true

      # Reward weights (spec Section 5.4). orient_handstand is DOMINANT (+1.5); the
      # +0.25 alive floor + dominant orientation + dense curriculum are the
      # anti-cold-start-collapse mitigations. Tune per stage if reward sticks at 0:
      # raise w_alive and/or loosen termination FIRST (spec Section 5.5).
      w_orient: 1.2
      w_orient_progress: 2.0
      w_sagittal: 1.0
      w_com: 0.5
      w_rear_contact: 0.5
      w_no_front: 0.4
      w_base_height: 0.6
      w_front_lift: 0.3
      w_alive: 0.1
      w_hold: 2.0
      k_orient: 4.0
      k_orient_y: 8.0
      k_com: 10.0
