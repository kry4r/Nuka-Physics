# BDX privileged-teacher PPO on the real rigid one-shot corridor.
#
# No camera: the observation is the 44 proprio features plus a parsed centre-line
# height profile (trunk clearance + 16 forward step-height differences), so PPO can
# anticipate the two sharp 5 cm down-steps.  A plain rl_games MLP over the flat 61-d
# vector; the task rewards/spawn/success are the S6 depth baseline, unchanged.
#
# Start curriculum: spawn on the platform, on the tread, and past both steps so the
# value of reaching the goal back-propagates onto the second step edge.
params:
  seed: 11

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: bdx_corridor_teacher_s2
    full_experiment_name: bdx_corridor_teacher_s2
    env_name: nuka_bdx_corridor_teacher
    multi_gpu: false
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    normalize_advantage: true
    value_bootstrap: true
    use_smooth_clamp: true
    torch_compile: false
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 2000
    save_best_after: 50
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 24
    num_actors: 256
    minibatch_size: 1536
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: true
    bounds_loss_coef: 0.005

    env_config:
      scene: examples/scenes/corridor_nomedia.nks
      dt: 0.005
      decimation: 4
      episode_length_s: 20.0
      resample_time_s: 40.0
      termination_height: 0.10
      termination_tilt_deg: 60.0
      command: [0.15, 0.0, 0.0]
      fixed_command: true
      # Reverse curriculum: platform / on-tread / past-both-steps spawn windows.
      # Tread window inset 4.5 cm from both edges so a foot never rides the edge.
      spawn_x_windows: [[-0.32, -0.12, 0.4], [0.145, 0.215, 0.3], [0.30, 0.60, 0.3]]
      # Reward progress relative to each randomized spawn (not absolute scene x).
      forward_progress_scale: 15.0
      progress_milestones: [0.35, 0.65, 1.2]
      progress_milestone_bonus: 2.0
      # Reaching the goal is a successful termination, relative to each spawn.
      success_progress_m: 1.2
      success_bonus: 100.0
      fall_penalty: 20.0
      push_enable: false
      sigma_lin: 0.01
      sigma_ang: 0.01
      reward_scales:
        tracking_lin_vel: 8.0
        tracking_ang_vel: 6.0
        torques: -1.0e-3
        action_rate: -0.3
        stand_still: -0.2
        alive: 10.0
        imitation: 1.0
