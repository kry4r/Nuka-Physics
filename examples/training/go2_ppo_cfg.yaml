# rl_games (1.6.5) PPO config for Nuka Go2 flat-ground locomotion.
#
# Hyperparameters ALIGNED to the official unitree_rl_gym / rsl_rl Go2 recipe
# (legged_gym/envs/base/legged_robot_config.py LeggedRobotCfgPPO + go2_config.py):
#   policy:    init_noise_std=1.0 (sigma const-init 0 -> std=exp(0)=1.0),
#              actor/critic hidden=[512,256,128], activation=elu.
#   algorithm: entropy_coef=0.01, value_loss_coef=1.0, clip_param=0.2,
#              num_learning_epochs(mini_epochs)=5, num_mini_batches=4
#              (-> minibatch = num_envs*horizon/4 = 4096*24/4 = 24576),
#              learning_rate=1e-3 adaptive, desired_kl(kl_threshold)=0.01,
#              gamma=0.99, lam(tau)=0.95, max_grad_norm=1.0.
#   runner:    num_steps_per_env(horizon)=24, max_iterations(max_epochs)=1500.
#   env:       terminate on base-ground CONTACT only (legged_gym
#              terminate_after_contacts_on=["base"]); the prior tilt>75 deg kill
#              over-culled recoverable wobbles and starved the reward signal -- now
#              base-height only (z<0.18 ~ base touching ground), tilt kill relaxed
#              to 120 deg (only a genuinely flipped robot, which emits pure-zero
#              reward forever, is culled). Set via env_config below.
#
# RATIONALE (the 1500-epoch collapse this fixes): mean reward stayed ~0 because the
# only_positive_rewards clamp zeros a cold-start policy whose negatives swamp the
# tiny velocity-tracking positive; with entropy_coef=0 there was no exploration
# pressure, so the actor saturated and the value head collapsed to predict 0. The
# recipe-aligned entropy_coef=0.01 + base-contact-only termination (longer episodes)
# + the larger [512,256,128] net + lr 1e-3 restore the legged_gym learning regime.
#
# ``env_name: nuka_go2`` resolves via the nuka.rl_games adapter (registered on
# import). ``num_actors`` / ``max_epochs`` / ``minibatch_size`` are overridden by
# train_go2_ppo.py (esp. for --smoke).
params:
  seed: 1

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    name: go2_locomotion
    full_experiment_name: go2_locomotion
    env_name: nuka_go2
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_advantage: True
    value_bootstrap: True
    use_smooth_clamp: True
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 100
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    num_actors: 4096
    minibatch_size: 24576
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: True
    bounds_loss_coef: 0.0001

    env_config:
      # env_name here is the nuka task selector; the adapter ignores extra keys
      # it doesn't use. device is created+owned by the env (single GPU).
      #
      # RANDOM command curriculum (fixed_command=false, the legged_gym default):
      # Go2LocomotionEnv resamples a per-env velocity command (vx/vy/wyaw in [-1,1],
      # xy zeroed if |xy|<0.2) on every reset + on the 10 s timer. This is the
      # recipe-faithful config and it LEARNS A COMMAND-CONDITIONED gait: after 250
      # epochs the policy tracks vx monotonically across the range -- eval
      # (cmd vx -> vx_body): -0.5 -> -0.462, 0.0 -> +0.002, +0.5 -> +0.467, +1.0 -> +1.032;
      # tilt 2-4 deg, 0 terminations over a 220-step x 64-env deterministic-mu sweep.
      #
      # ``command`` below is only the INITIAL value (immediately overwritten by the
      # first resample). ``fixed_command: true`` is an opt-in lever that PINS the
      # command for the whole run (no resample) -- useful as a reduce-the-problem
      # baseline; the fixed-[0.5,0,0] config converges to a cleaner single-speed walk
      # (vx_body 0.46 ~ cmd 0.5, reward ~26) but cannot condition on the command.
      #
      # THE FIX THAT MADE EITHER LEARN (was a 1500-epoch collapse: reward==0,
      # ep_len~22): the gym action space is declared at +-1 (go2_obs.ACTION_SPACE_LIMIT),
      # NOT +-100 -- rl_games (clip_actions=true) RESCALES the policy's [-1,1] output
      # onto the action-space bounds, so a +-100 space 100x-amplified the applied
      # action (measured mean|a|=64) -> joints slammed -> robot tipped in ~21 steps ->
      # all-negative reward -> only_positive_rewards zeroed it -> value head collapsed.
      command: [0.5, 0.0, 0.0]
      fixed_command: false
      # Termination = base-ground contact only (legged_gym terminate_after_contacts_on
      # =["base"]). base-height z<0.18 ~ base touching ground; tilt kill relaxed to
      # 120 deg so only a genuinely flipped robot is culled (the 75 deg default
      # over-killed recoverable wobbles -> short episodes -> starved reward signal).
      termination_tilt_deg: 120.0
      termination_height: 0.18

      # ---------------------------------------------------------------------
      # Go2-on-stairs Phase 2b: BLIND terrain curriculum (default DISABLED so
      # the flat training path above is reproduced byte-for-byte). Set
      # enable=true (or pass --terrain to train_go2_ppo.py) to cook the
      # procedural terrain + drive a per-env type+difficulty curriculum.
      #
      # GEOMETRY (model-level cook config; step_height is the MAX, difficulty
      # scales it down): owner step-height band 0.08-0.15 m -> step_height 0.15
      # at create, per-env DIFFICULTY in [~0.53, 1.0] -> realized [0.08, 0.15].
      #
      # CURRICULUM: all envs start at the easiest difficulty (start_difficulty
      # ~= 0.53 -> 0.08 m steps) on a round-robin of the 3 terrain types
      # (stairs/pit/boxes). On reset an env is PROMOTED (difficulty += step;
      # once it tops out, advanced to the next type) if its episode mean reward
      # cleared promote_thr, and DEMOTED (difficulty -= step) if it FELL.
      terrain:
        enable: false
        # Procedural-terrain cook geometry (the 5 create_from_scene terrain_*).
        step_height: 0.15        # the MAX rise per ring (difficulty scales DOWN).
        step_width: 0.3          # horizontal width of each step ring.
        platform_width: 1.0      # central top-platform / pit edge length.
        grid_width: 0.45         # RandomBoxes cell edge.
        grid_height_max: 0.15    # RandomBoxes max per-cell rise.
        ground_height: 0.0       # absolute floor (matches the flat scene).
        # Curriculum knobs.
        start_difficulty: 0.5333 # 0.08/0.15 -> easiest tier = 0.08 m steps.
        promote_thr: 8.0         # episode MEAN reward to promote (per-step ~0.005
                                 # -> ~ a sustained-walk episode return / length).
        demote_on_fall: true     # a terminated (fell) episode demotes the env.
        difficulty_step: 0.1     # promote/demote increment.
        ema_beta: 0.99           # reward-EMA smoothing (diagnostic gate).
        # Per-env START type weights {0:Flat,1:Stairs,2:Pit,3:Boxes}. Omit/empty
        # => deterministic round-robin over {stairs, pit, boxes} (all 3 trained).
        # type_distribution: {1: 1.0, 2: 1.0, 3: 1.0}
