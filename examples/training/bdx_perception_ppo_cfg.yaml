# BDX head-depth PPO on the real rigid one-shot corridor.
#
# The sensor remains a 128x96 image in the rollout (fp16, CHW), but the policy
# never flattens it into an MLP: bdx_depth_fusion encodes it to 96 values, then
# fuses those with 44 proprio values and one frame-age value.  The proven v9 blind
# actor is loaded inside the network and the visual residual starts at exactly zero.
params:
  seed: 11

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: bdx_depth_fusion
    depth_latent_dim: 96
    proprio_units: [512, 256, 128]
    bootstrap_checkpoint: /data/xtzhang25/_work/activate/out/bdx_walk_v9/nn/last_bdx_walk_v9_ep_2000_rew_447.30893.pth

  config:
    name: bdx_perception_corridor
    full_experiment_name: bdx_perception_corridor
    env_name: nuka_bdx_perception
    multi_gpu: false
    mixed_precision: false
    # Proprio uses the frozen v9 statistics inside the fused network; depth is
    # already clipped/inverted to [0,1].  A generic per-pixel RMS is undesirable.
    normalize_input: false
    normalize_value: true
    normalize_advantage: true
    value_bootstrap: true
    use_smooth_clamp: true
    # Keep the first smoke/train deterministic and debuggable.  Enable compile
    # only after the complete Dict-observation pipeline gate is green.
    torch_compile: false
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 2000
    save_best_after: 50
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 24
    num_actors: 256
    # Four CNN minibatches per rollout; one 6144-image minibatch creates an
    # unnecessary activation spike on the 20 GiB GPU1.
    minibatch_size: 1536
    mini_epochs: 5
    critic_coef: 1.0
    clip_value: true
    bounds_loss_coef: 0.005

    env_config:
      scene: examples/scenes/corridor_nomedia.nks
      dt: 0.005
      decimation: 4
      episode_length_s: 20.0
      resample_time_s: 40.0
      termination_height: 0.10
      termination_tilt_deg: 60.0
      command: [0.15, 0.0, 0.0]
      fixed_command: true
      # Vary distance-to-edge so a fixed gait phase/timer cannot solve the drop.
      # The whole rigid corridor is unchanged; only the reset base x moves on the
      # broad raised start platform.
      spawn_x_range: [-0.32, -0.12]
      # Reward progress relative to each randomized spawn (not absolute scene x).
      # 0.35/0.65 m roughly bracket one/two-step traversal, while 1.2 m rewards
      # entering the next interaction zone. Each bonus is once per episode.
      forward_progress_scale: 15.0
      progress_milestones: [0.35, 0.65, 1.2]
      progress_milestone_bonus: 2.0
      # Episodic task contract: reaching the goal is a successful termination, not
      # an endless alive-reward tail.  Values are relative to each randomized spawn.
      success_progress_m: 1.2
      success_bonus: 100.0
      fall_penalty: 20.0
      push_enable: false
      sigma_lin: 0.01
      sigma_ang: 0.01
      reward_scales:
        tracking_lin_vel: 8.0
        tracking_ang_vel: 6.0
        torques: -1.0e-3
        action_rate: -0.3
        stand_still: -0.2
        alive: 10.0
        imitation: 1.0
      sensor:
        width: 128
        height: 96
        update_period: 2       # 50 Hz control -> 25 Hz camera
        near_clip: 0.05
        far_clip: 3.0
        vfov: 70.0
        mount_joint_pattern: ^head_roll$
        # pos3 + quat(wxyz): external head mount, upright image, 20 deg down.
        mount_offset: [0.12, 0.0, -0.14, 0.696364240320019,
                       -0.12278780396897285, 0.12278780396897285,
                       -0.696364240320019]
