# Meta-schema for Universal Row IR v0.1. Validates row class definitions.
schema_version: "0.1"

required_fields:
  - row_class_id
  - row_class_name
  - body_count_mode
  - body_count
  - jacobian_kind
  - max_rows_per_block
  - supports_friction
  - supports_compliance
  - default_gradient_mode
  - default_recompute_mode
  - forward_evaluator
  - constraint_kind

field_types:
  row_class_id: uint32
  row_class_name: string
  body_count_mode: enum
  body_count: nullable_uint32
  jacobian_kind: enum
  max_rows_per_block: uint32
  supports_friction: bool
  supports_compliance: bool
  default_gradient_mode: enum
  default_recompute_mode: enum
  forward_evaluator: object
  constraint_kind: enum

enums:
  body_count_mode:
    - fixed
    - variable
  jacobian_kind:
    - maximal_6vec
    - featherstone_chain_scalar
    - mixed
  default_gradient_mode:
    - dense_adjoint
    - stop_grad_on_event
    - ift_at_convergence
    - none
  default_recompute_mode:
    - tape
    - checkpoint
    - recompute_always
  constraint_kind:
    - equality
    - unilateral
    - unilateral_with_friction

forward_evaluator:
  required_fields:
    - input_fields
    - output_fields
    - body_index_field
    - jacobian_field
    - inner_loop_strategy
    - warm_start

# OPTIONAL reverse-mode block. Present only on row classes whose forward-update
# has a concrete differentiable definition this milestone (v0.5 slice:
# maximal_drive). When present, regen.py emits a paired primal+adjoint device
# header and an adjoint kernel; when absent the class keeps a forward-only stub.
adjoint_evaluator:
  required_fields:
    - grad_input_fields      # differentiable inputs x: grad wrt each is emitted
    - grad_output_fields     # forward output y = f(x); seeds v = dL/dy (single scalar)
    - unclamped_expression   # C expr for u (the law BEFORE the force-limit clamp)
    - derivative_rules       # map: grad_input_field -> C expr for du/dx_i
  # The emitted primal is clamp(u, -force_limit, +force_limit); the single
  # `unclamped_expression` u is the one source of truth shared by the primal,
  # the saturation test, and (via the chain rule) the derivative_rules. Each
  # derivative_rules expression is du/dx_i and is multiplied by `kClampActive`
  # (1.0f strictly inside the force-limit band, else 0.0f) by the emitter, so
  # the IR rules stay clamp-agnostic. Expressions may reference any
  # grad_input_field name and `force_limit`.

flags_bitfield:
  - Equality
  - Unilateral
  - Friction
  - Coupled
  - GradActive
