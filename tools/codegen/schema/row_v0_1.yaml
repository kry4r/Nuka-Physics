# Meta-schema for Universal Row IR v0.1. Validates row class definitions.
schema_version: "0.1"

required_fields:
  - row_class_id
  - row_class_name
  - body_count_mode
  - body_count
  - jacobian_kind
  - max_rows_per_block
  - supports_friction
  - supports_compliance
  - default_gradient_mode
  - default_recompute_mode
  - forward_evaluator
  - constraint_kind

field_types:
  row_class_id: uint32
  row_class_name: string
  body_count_mode: enum
  body_count: nullable_uint32
  jacobian_kind: enum
  max_rows_per_block: uint32
  supports_friction: bool
  supports_compliance: bool
  default_gradient_mode: enum
  default_recompute_mode: enum
  forward_evaluator: object
  constraint_kind: enum

enums:
  body_count_mode:
    - fixed
    - variable
  jacobian_kind:
    - maximal_6vec
    - featherstone_chain_scalar
    - mixed
  default_gradient_mode:
    - dense_adjoint
    - stop_grad_on_event
    - ift_at_convergence
    - none
  default_recompute_mode:
    - tape
    - checkpoint
    - recompute_always
  constraint_kind:
    - equality
    - unilateral
    - unilateral_with_friction

forward_evaluator:
  required_fields:
    - input_fields
    - output_fields
    - body_index_field
    - jacobian_field
    - inner_loop_strategy
    - warm_start

# OPTIONAL reverse-mode block. Present only on row classes whose forward-update
# has a concrete differentiable definition this milestone (v0.5 slice:
# maximal_drive). When present, regen.py emits a paired primal+adjoint device
# header and an adjoint kernel; when absent the class keeps a forward-only stub.
adjoint_evaluator:
  required_fields:
    - grad_input_fields      # differentiable inputs x: grad wrt each is emitted
    - grad_output_fields     # forward output y = f(x); seeds v = dL/dy (single scalar)
    - unclamped_expression   # C expr for u (the law BEFORE the clamp)
    - derivative_rules       # map: grad_input_field -> C expr for du/dx_i
  # The emitted primal is clamp(u, <band>); the single `unclamped_expression` u
  # is the one source of truth shared by the primal, the saturation/event test,
  # and (via the chain rule) the derivative_rules. Each derivative_rules
  # expression is du/dx_i and is multiplied by the inside-the-band indicator by
  # the emitter, so the IR rules stay clamp-agnostic.
  #
  # OPTIONAL strategy selectors (omit -> the v0.5 maximal_drive defaults, which
  # regenerate byte-identical to the original drive slice):
  #
  #   clamp_strategy:                  # how the band is parameterized
  #     - symmetric_force_limit        # (DEFAULT) band = [-force_limit, +force_limit];
  #                                    #   the `in` struct carries a `force_limit` field;
  #                                    #   expressions may reference `force_limit`.
  #     - box_lower_upper              # band = [lower, upper] (asymmetric box); the `in`
  #                                    #   struct carries `lower`/`upper` fields; an
  #                                    #   unbounded side (equality rows) uses a huge
  #                                    #   sentinel so the clamp is never active.
  #
  #   event_strategy:                  # what the inside-band indicator MEANS
  #     - subgradient                  # (DEFAULT) clamp is non-smooth at saturation; the
  #                                    #   indicator is the clamp sub-gradient (dense_adjoint).
  #     - stop_grad_on_event           # the indicator is the stop-gradient on the
  #                                    #   active-set / friction-cone event boundary; the
  #                                    #   __global__ kernel additionally ANDs the stored
  #                                    #   Row.event_flag (stop_grad_on_event row classes).
  #
  # Expressions may reference any grad_input_field name plus the clamp-band field(s)
  # of the selected clamp_strategy (`force_limit`, or `lower`/`upper`).

flags_bitfield:
  - Equality
  - Unilateral
  - Friction
  - Coupled
  - GradActive
