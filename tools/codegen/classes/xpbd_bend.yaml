row_class_id: 7
row_class_name: XPBDBendRow

body_count_mode: fixed
body_count: 4

jacobian_kind: maximal_6vec
max_rows_per_block: 6

supports_friction: false
supports_compliance: true
default_gradient_mode: dense_adjoint
default_recompute_mode: checkpoint
constraint_kind: equality

# Signed dihedral geometry is evaluated on the production particle path.
forward_evaluator:
  input_fields:
    - body_a
    - body_b
    - jacobian_linear_a
    - jacobian_angular_a
    - jacobian_linear_b
    - jacobian_angular_b
    - rhs
    - lower
    - upper
    - lambda
    - effective_mass
  output_fields:
    - lambda
    - position_error
  body_index_field: body_list_offset
  jacobian_field: jacobian_offset
  inner_loop_strategy: row_serial_jacobi
  warm_start: true

# This local adjoint differentiates the reduced XPBD multiplier update.
adjoint_evaluator:
  clamp_strategy: box_lower_upper
  event_strategy: subgradient
  grad_input_fields:
    - C
    - lambda
    - effective_mass
    - alpha_tilde
  grad_output_fields:
    - lambda_new
  unclamped_expression: >-
    lambda + effective_mass * (-C - alpha_tilde * lambda)
  derivative_rules:
    C: "-effective_mass"
    lambda: "1.0f - effective_mass * alpha_tilde"
    effective_mass: "(-C - alpha_tilde * lambda)"
    alpha_tilde: "-effective_mass * lambda"
