patterns:
  - id: float_atomic_add
    description: "atomicAdd on float/double breaks D1 strong determinism"
    regex: '\batomicAdd\s*\(\s*[^,)]+,\s*[^,)]+\s*\)'
    scope: physics_path
    severity: error

  - id: hot_path_cuda_malloc
    description: "cudaMalloc / cudaMallocAsync in per-step kernels = hot-path allocation"
    regex: '\b(cudaMalloc|cudaMallocAsync)\s*\('
    scope: hot_path
    severity: error

  - id: shared_mem_cross_row_class
    description: "__shared__ memory spanning multiple row classes within one dispatch is a determinism risk"
    regex: '__shared__\s+\w+\s+\w+\[.*\];.*//\s*ROW_CLASS:\s*\*'
    scope: physics_path
    severity: error

  - id: exception_across_c_abi
    description: "throw across extern \"C\" boundary is undefined behavior"
    regex: 'throw\s+'
    scope: c_abi_files
    severity: error

  - id: stl_in_public_header
    description: "std::vector / std::string / std::map etc. in public C++20 wrapper headers fragments ABI"
    regex: '\b(std::vector|std::string|std::map|std::unordered_map)\b'
    scope: public_headers
    severity: error

scope_definitions:
  physics_path:
    include:
      - "src/solver/**/*.cu"
      - "src/solver/**/*.cuh"
      - "src/constraint/**/*.cu"
      - "src/runtime/**/*.cu"
      # v0.5 p03: the diff-sim backward / sparse-solver path is D1-critical (its
      # grad/solve outputs must be two-run byte-exact), so the no-float-atomic ban
      # now covers it too. NOTE: src/diffsim is added to physics_path ONLY (the
      # float_atomic_add rule). It is deliberately NOT in hot_path: the IFT
      # Delassus builder keeps a size-guarded lazy cudaMalloc (allocate-once, reuse
      # across Run calls) which is not a per-step hot-path alloc and must not trip
      # hot_path_cuda_malloc.
      - "src/diffsim/**/*.cu"
      - "src/diffsim/**/*.cuh"
      # v0.5 p04 N1: the sensor-noise kernels are D1-critical (their noise must
      # be two-run byte-exact via the counter-based Philox RNG -- no thread-order
      # dependence, NO float atomicAdd). Same rationale as src/diffsim above; the
      # noise path is NOT in hot_path (it is applied to a sensor buffer once, not
      # inside a per-step physics kernel).
      - "src/sensor/noise/**/*.cu"
      - "src/sensor/noise/**/*.cuh"
    exclude:
      - "src/**/reference/**"
      - "tests/**"

  hot_path:
    include:
      - "src/solver/**/*.cu"
      - "src/constraint/**/*.cu"
      - "src/runtime/gpu/**/*.cu"
    exclude:
      - "src/runtime/world_builder.cpp"
      - "src/import/**"

  c_abi_files:
    include:
      - "src/c_abi/**/*.cpp"
      - "src/c_abi/**/*.hpp"

  public_headers:
    include:
      - "src/include/nuka/**/*.hpp"
      - "src/include/nuka/**/*.h"

generated_file_headers:
  - id: generated_do_not_edit_header
    description: "generated codegen outputs must carry the DO-NOT-EDIT header"
    include:
      - "src/codegen/generated/**/*.cu"
      - "src/codegen/generated/**/*.cuh"
      - "src/codegen/generated/**/*.hpp"
    first_line_regex: '^// GENERATED — DO NOT EDIT$'
