patterns:
  - id: float_atomic_add
    description: "atomicAdd on float/double breaks D1 strong determinism"
    regex: '\batomicAdd\s*\(\s*[^,)]+,\s*[^,)]+\s*\)'
    scope: physics_path
    severity: error

  - id: hot_path_cuda_malloc
    description: "cudaMalloc / cudaMallocAsync in per-step kernels = hot-path allocation"
    regex: '\b(cudaMalloc|cudaMallocAsync)\s*\('
    scope: hot_path
    severity: error

  - id: shared_mem_cross_row_class
    description: "__shared__ memory spanning multiple row classes within one dispatch is a determinism risk"
    regex: '__shared__\s+\w+\s+\w+\[.*\];.*//\s*ROW_CLASS:\s*\*'
    scope: physics_path
    severity: error

  - id: exception_across_c_abi
    description: "throw across extern \"C\" boundary is undefined behavior"
    regex: 'throw\s+'
    scope: c_abi_files
    severity: error

  - id: stl_in_public_header
    description: "std::vector / std::string / std::map etc. in public C++20 wrapper headers fragments ABI"
    regex: '\b(std::vector|std::string|std::map|std::unordered_map)\b'
    scope: public_headers
    severity: error

  # M1 (PHI v2): the nk engine layer (scene / render / app glue + src/nk core)
  # must NEVER touch CUDA directly — all device work goes THROUGH the phi v2
  # backend vtable. These four rules wall the engine off from raw CUDA: no
  # triple-chevron launches, no cuda* runtime calls, no <cuda_runtime*> include,
  # and no reach-in to the phi CUDA backend internals.
  - id: nk_engine_no_chevron_launch
    description: "<<< triple-chevron kernel launch in nk engine layer (use the phi v2 backend, not raw CUDA)"
    regex: '<<<'
    scope: nk_engine
    severity: error

  - id: nk_engine_no_cuda_runtime_call
    description: "cuda*() runtime call in nk engine layer (device work must go through the phi v2 backend)"
    regex: '\bcuda[A-Z]\w*\s*\('
    scope: nk_engine
    severity: error

  - id: nk_engine_no_cuda_runtime_include
    description: "#include <cuda_runtime...> in nk engine layer (engine is CUDA-type-free; go through phi v2)"
    regex: '#include\s+<cuda_runtime'
    scope: nk_engine
    severity: error

  - id: nk_engine_no_phi_backend_include
    description: "#include \"phi/backend_cuda...\" in nk engine layer (use the phi v2 public surface, not backend internals)"
    regex: '#include\s+"phi/backend_cuda'
    scope: nk_engine
    severity: error

scope_definitions:
  physics_path:
    include:
      - "src/solver/**/*.cu"
      - "src/solver/**/*.cuh"
      - "src/constraint/**/*.cu"
      - "src/runtime/**/*.cu"
      # v0.5 p04.9 CUDA-commons consolidation: the shared __device__ math/spatial
      # cores (math/cuda_*_ops.cuh) and the new articulation device-helper header
      # (runtime/articulation/articulation_device_helpers.cuh) now hold D1-critical
      # device code that was MOVED OUT of the *.cu TUs (which were already in
      # physics_path). Add the *.cuh globs so the no-float-atomic ban keeps covering
      # that code -- otherwise the consolidation would silently move it out from
      # under the guard (the by-design hole the lint scope must not reopen).
      - "src/runtime/**/*.cuh"
      - "src/math/**/*.cuh"
      # v0.5 p03: the diff-sim backward / sparse-solver path is D1-critical (its
      # grad/solve outputs must be two-run byte-exact), so the no-float-atomic ban
      # now covers it too. NOTE: src/diffsim is added to physics_path ONLY (the
      # float_atomic_add rule). It is deliberately NOT in hot_path: the IFT
      # Delassus builder keeps a size-guarded lazy cudaMalloc (allocate-once, reuse
      # across Run calls) which is not a per-step hot-path alloc and must not trip
      # hot_path_cuda_malloc.
      - "src/diffsim/**/*.cu"
      - "src/diffsim/**/*.cuh"
      # v0.5 p04 N1: the sensor-noise kernels are D1-critical (their noise must
      # be two-run byte-exact via the counter-based Philox RNG -- no thread-order
      # dependence, NO float atomicAdd). Same rationale as src/diffsim above; the
      # noise path is NOT in hot_path (it is applied to a sensor buffer once, not
      # inside a per-step physics kernel).
      - "src/sensor/noise/**/*.cu"
      - "src/sensor/noise/**/*.cuh"
      # p14a (v0.7): the contact-force readout kernel (sensor/contact_wrench.cu) is
      # D1-critical -- its per-link wrench must be two-run byte-exact (one thread
      # per output link, fixed slot order, NO float atomicAdd into the output). Add
      # all of src/sensor/**/*.cu(h) so any future sensor kernel is guarded too
      # (the noise-only globs above did NOT cover src/sensor/*.cu at the top level).
      - "src/sensor/**/*.cu"
      - "src/sensor/**/*.cuh"
      # v0.7 p04: the LBVH rigid broadphase (src/collision/**) is D1-critical --
      # its compact candidate-pair output must be two-run byte-exact. The only
      # atomics in the Karras build / bottom-up AABB propagation / refit / pair
      # append are uint32 (visit-counters + append index); a float atomicAdd
      # would break D1, so the no-float-atomic ban MUST cover this path. The
      # pre-p04 scope did NOT include src/collision/**; add it here.
      - "src/collision/**/*.cu"
      - "src/collision/**/*.cuh"
      # v0.7 p12: the self-written CUDA ray tracer (src/rt/**) is D1-critical --
      # its closest-hit depth + prim-id framebuffers must be two-run byte-exact.
      # The traversal is one-thread-per-pixel with a sequential local
      # best_t/best_prim register and ZERO atomics (no float atomicMin/atomicAdd
      # on depth -- the RT analog of the PBF/coupling races this ban catches), so
      # the no-float-atomic guard MUST cover this path. Added to physics_path
      # ONLY (NOT hot_path): RenderDepth allocates its output framebuffers like
      # cross_system_query does -- a per-frame sensor render, not a per-step
      # physics kernel -- so it must not trip hot_path_cuda_malloc.
      - "src/rt/**/*.cu"
      - "src/rt/**/*.cuh"
    exclude:
      - "src/**/reference/**"
      - "tests/**"

  hot_path:
    include:
      - "src/solver/**/*.cu"
      - "src/constraint/**/*.cu"
      - "src/runtime/gpu/**/*.cu"
      # M1 (PHI v2): op implementations (phi/backend_cuda/ops/**) are the new
      # per-step physics kernels of the ggml-style backend layer. The plan's
      # intent "op 实现内禁分配" — ops MUST NOT allocate; the legitimate v2
      # allocation home is phi/backend_cuda/cuda_buffer.cu (NOT under ops/), so
      # scoping the cudaMalloc ban to ops/ specifically leaves the allocator
      # untouched while guarding every op TU.
      - "src/phi/backend_cuda/ops/**/*.cu"
      - "src/phi/backend_cuda/ops/**/*.cuh"
    exclude:
      - "src/runtime/world_builder.cpp"
      - "src/import/**"

  # M1 (PHI v2): the nk engine layer. Covers the new nk core + scene + render +
  # runtime/app glue. These dirs may not all exist yet (M2+ creates them) — the
  # glob simply matches nothing until they do, which is fine. The ban set keeps
  # the engine layer CUDA-type-free so it routes ALL device work through the phi
  # v2 backend vtable (the multi-backend portability invariant).
  nk_engine:
    include:
      - "src/nk/**/*.hpp"
      - "src/nk/**/*.cpp"
      - "src/scene/**/*.hpp"
      - "src/scene/**/*.cpp"
      - "src/render/**/*.hpp"
      - "src/render/**/*.cpp"
      - "src/runtime/app/**/*.hpp"
      - "src/runtime/app/**/*.cpp"

  c_abi_files:
    include:
      - "src/c_abi/**/*.cpp"
      - "src/c_abi/**/*.hpp"

  public_headers:
    include:
      - "src/include/nuka/**/*.hpp"
      - "src/include/nuka/**/*.h"

generated_file_headers:
  - id: generated_do_not_edit_header
    description: "generated codegen outputs must carry the DO-NOT-EDIT header"
    include:
      - "src/codegen/generated/**/*.cu"
      - "src/codegen/generated/**/*.cuh"
      - "src/codegen/generated/**/*.hpp"
    first_line_regex: '^// GENERATED — DO NOT EDIT$'
