# ===========================================================================
# nk field registry — THE single source of truth for the device field layout.
# Consumed by tools/codegen/fields/gen_fields.py -> src/nk/model/generated/
#   field_ids.hpp / views.hpp / arena_layout.hpp / dlpack_table.hpp
# (regen via tools/codegen/regen.py; the generated headers are committed).
#
# Plan §3.3. Each field is one named device array. The table below is the 1:1
# transcription of the production stepping paths' device state:
#   * ArticulationDeviceState (runtime/articulation/articulation_state.hpp) —
#     Featherstone ABA / FK / CRBA state (per dof / per link / per env).
#   * runtime::rigid::BodyState (runtime/rigid/body_state.hpp) — movable rigid
#     body SoA (per body).
#   * XpbdWorld (runtime/soft/xpbd_world.hpp) — XPBD particle + 4 constraint
#     families (per particle / per dist_con / per bend_con / per vol_con / ...).
#   * PbfWorld (runtime/fluid/pbf_world.hpp) — PBF particle SoA (per particle).
#   * unified row solve — contacts / rows / sides / lambda warm-start / m_inv /
#     the SolveSchedule island tables / contact_count + row_count watermarks.
#   * material buckets (CookedContactParamTable upgrade, Isaac bucketing) +
#     per-body bucket index + RNG state for domain randomization.
#
# ---------------------------------------------------------------------------
# schema (plan §3.3 + the explicit `owner` key M3a adds):
#   name   : C identifier — the View member name + the FieldId enumerator stem.
#   dtype  : f32 | u32 | u64 | vec3 | quat | transform | spatial6 | mat36
#            (pointer element type; transform/quat/vec3/spatial6/mat36 map to
#             the engine math types via views.hpp typedefs.)
#   per    : the count-unit the array is sized by —
#            env | dof | link | body | contact_slot | row_slot | particle |
#            dist_con | bend_con | vol_con | shape_match_slot | scalar
#            (plus the §3.3 examples' env_dof2). `scalar` uses an explicit count.
#   arena  : persistent | scratch | tape   (which of the 3 phi Buffers it lives in)
#   owner  : model | data
#            model = immutable cook product (topology / templates / capacities),
#                    packed into the ONE Model device buffer, exposed via ModelView.
#            data  = mutable per-World state, lives in the Arena, exposed via DataView.
#            (Inference rule, applied where omitted: arena fields => data;
#             explicit `owner: model` marks the cook-constant tables. M3a sets it
#             explicitly on EVERY field for clarity — no inference is relied on.)
#   flags  : diff (tape-visible / DLPack-diff) | param (randomizable) | readout
#   elem   : (optional) element multiplier for a packed-array field (e.g. rows=16
#            floats per row_slot). Default 1.
#   count  : (optional) explicit element count expression for per: scalar fields.
# ===========================================================================

schema:
  dtype: [f32, u32, u64, u8, vec3, quat, transform, spatial6, mat36]
  per:   [env, dof, link, body, contact_slot, row_slot, slot_dof, particle, dist_con, bend_con, vol_con, shape_match_slot, env_dof2, scalar]
  arena: [persistent, scratch, tape]
  owner: [model, data]
  flags: [diff, param, readout]

fields:
  # =========================================================================
  # §3.3 examples. M3b honesty fix vs the plan snippet: the articulation scalar
  # state (q/qdot/qddot/tau/joint_force/joint_diagonal) is keyed per:LINK, not
  # per:dof — the legacy ArticulationDeviceState (the 1:1 transcription source)
  # sizes ALL of them total_link_count and the D1-validated kernels index them
  # BY LINK (a FloatingBase root's scalar slot is simply unused; its 6 DOFs live
  # in link_velocity[root]). Re-keying preserves the byte-exact port. dof stays
  # the capacity unit for the M tile (env_dof2 == max_dof^2).
  # =========================================================================
  - {name: q,             dtype: f32,       per: link,         arena: persistent, owner: data,  flags: [diff]}
  - {name: qdot,          dtype: f32,       per: link,         arena: persistent, owner: data,  flags: [diff]}
  - {name: link_pose,     dtype: transform, per: link,         arena: persistent, owner: data}
  - {name: base_pose,     dtype: transform, per: env,          arena: persistent, owner: data,  flags: [diff]}
  - {name: body_pose,     dtype: transform, per: body,         arena: persistent, owner: data,  flags: [diff]}
  - {name: body_inv_mass, dtype: f32,       per: body,         arena: persistent, owner: data,  flags: [param]}
  - {name: contact_count, dtype: u32,       per: env,          arena: scratch,    owner: data}
  # M4 re-key (the M3b "rows is 3x oversized" note): `rows` is the FUSED-family
  # ArticulatedContactRow record, ONE per CONTACT slot (the legacy layout the
  # ported foot kernels index as rows[env*kMaxFootContactsPerEnv + s]). The
  # UNION-family CSR row records live in `urows` (per row_slot) below.
  - {name: rows,          dtype: f32,       per: contact_slot, arena: scratch,    owner: data,  elem: 16}
  - {name: lambda,        dtype: f32,       per: row_slot,     arena: persistent, owner: data}
  - {name: m_inv,         dtype: f32,       per: env_dof2,     arena: scratch,    owner: data}
  - {name: particle_pos,  dtype: vec3,      per: particle,     arena: persistent, owner: data,  flags: [diff]}
  - {name: mat_buckets,   dtype: f32,       per: scalar, count: "num_buckets*8", arena: persistent, owner: data, flags: [param]}
  - {name: mat_index,     dtype: u32,       per: body,         arena: persistent, owner: data,  flags: [param]}
  - {name: link_contact_wrench, dtype: spatial6, per: link,    arena: scratch,    owner: data,  flags: [readout]}

  # =========================================================================
  # ARTICULATION dynamics state — DATA (mutable per-step Featherstone state).
  # Source: ArticulationDeviceState (articulation_state.hpp). q/qdot/base_pose/
  # link_pose already declared above (the §3.3 examples). The rest follow 1:1.
  # =========================================================================
  - {name: qddot,                 dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: tau,                   dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: joint_force,           dtype: f32,       per: link, arena: scratch,    owner: data}
  - {name: joint_diagonal,        dtype: f32,       per: link, arena: scratch,    owner: data}
  - {name: link_velocity,         dtype: spatial6,  per: link, arena: persistent, owner: data,  flags: [diff]}
  - {name: link_acceleration,     dtype: spatial6,  per: link, arena: scratch,    owner: data}
  - {name: link_velocity_bias,    dtype: spatial6,  per: link, arena: scratch,    owner: data}
  - {name: link_xup,              dtype: mat36,     per: link, arena: scratch,    owner: data}
  - {name: link_articulated_I,    dtype: mat36,     per: link, arena: scratch,    owner: data}
  - {name: link_bias_force,       dtype: spatial6,  per: link, arena: scratch,    owner: data}
  - {name: link_u_spatial,        dtype: spatial6,  per: link, arena: scratch,    owner: data}
  # joint_motion_subspace is DATA (scratch), not a model table: ABA Pass-1
  # REWRITES it every step (MotionSubspaceForJoint / the floating-base Zero6)
  # before the CRBA reads it — a 1:1 port of the legacy mutable buffer.
  - {name: joint_motion_subspace, dtype: spatial6,  per: link, arena: scratch,    owner: data}
  # PD drive state (legacy BatchedArticulatedStepParams drive_* device arrays,
  # link-major). drive_target is the RL action surface; the other three are
  # cook-seeded hold-drive params (randomizable later).
  - {name: drive_target,          dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  - {name: drive_stiffness,       dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  - {name: drive_damping,         dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  - {name: drive_force_limit,     dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  # Reset/snapshot state (device-resident; backs SnapshotState/RestoreState/
  # ResetEnvs ops — the legacy BatchedArticulatedWorld snapshot_* buffers 1:1).
  - {name: snapshot_q,             dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: snapshot_qdot,          dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: snapshot_link_velocity, dtype: spatial6,  per: link, arena: persistent, owner: data}
  - {name: snapshot_base_pose,     dtype: transform, per: env,  arena: persistent, owner: data}
  - {name: reset_env_ids,          dtype: u32,       per: env,  arena: scratch,    owner: data}

  # =========================================================================
  # ARTICULATION topology / inertia / templates — MODEL (cook-constant).
  # Source: ArticulationDeviceState constant arrays + ArticulationCookedTopology.
  # These are packed into the ONE Model device buffer and exposed via ModelView.
  # =========================================================================
  - {name: link_inertia,          dtype: mat36,     per: link, arena: persistent, owner: model}
  - {name: link_local_pose,       dtype: transform, per: link, arena: persistent, owner: model}
  - {name: link_inertial_frame,   dtype: transform, per: link, arena: persistent, owner: model}
  - {name: joint_axis,            dtype: vec3,      per: link, arena: persistent, owner: model}
  - {name: parent_offset,         dtype: vec3,      per: link, arena: persistent, owner: model}
  # u8: the EXACT legacy ArticulationJointType storage (uint8_t-backed enum) so
  # ops and the diffsim bridge can alias the table as ArticulationJointType*.
  - {name: joint_type,            dtype: u8,        per: link, arena: persistent, owner: model}
  - {name: parent_link,           dtype: u32,       per: link, arena: persistent, owner: model}
  - {name: link_body,             dtype: u32,       per: link, arena: persistent, owner: model}
  - {name: link_to_articulation,  dtype: u32,       per: link, arena: persistent, owner: model}
  - {name: joint_damping,         dtype: f32,       per: link, arena: persistent, owner: model, flags: [param]}
  - {name: joint_armature,        dtype: f32,       per: link, arena: persistent, owner: model, flags: [param]}
  # per-env articulation offset tables (one entry per articulation; here keyed by
  # env since the cook replicates exactly one articulation template per env).
  - {name: articulation_link_count,  dtype: u32, per: env, arena: persistent, owner: model}
  - {name: articulation_link_offset, dtype: u32, per: env, arena: persistent, owner: model}
  # Foot-shape table (legacy articulation::FootShape feet_ buffer 1:1): a GLOBAL
  # table (shared by all envs, base-relative link indices), 5 scalars per slot
  # {calf_local_link(u32 bits), offset.xyz, radius}, max_contacts_per_env slots.
  - {name: foot_shape, dtype: f32, per: scalar, count: "max_contacts_per_env*5", arena: persistent, owner: model}

  # =========================================================================
  # RIGID BODY SoA — DATA. Source: runtime::rigid::BodyState. body_pose +
  # body_inv_mass declared above (§3.3). The remaining BodyState members follow.
  # body_pose carries position+orientation; here we keep the linear/angular vel,
  # accumulated force/torque, and the inverse-inertia diag.
  # =========================================================================
  - {name: body_linear_velocity,  dtype: vec3, per: body, arena: persistent, owner: data, flags: [diff]}
  - {name: body_angular_velocity, dtype: vec3, per: body, arena: persistent, owner: data, flags: [diff]}
  - {name: body_force,            dtype: vec3, per: body, arena: scratch,    owner: data}
  - {name: body_torque,           dtype: vec3, per: body, arena: scratch,    owner: data}
  - {name: body_inv_inertia,      dtype: vec3, per: body, arena: persistent, owner: data, flags: [param]}

  # =========================================================================
  # BROADPHASE / NARROWPHASE scratch — DATA. AABB set + candidate pairs +
  # contact manifold. row_count is the row watermark companion of contact_count.
  # =========================================================================
  - {name: body_aabb_lo,    dtype: vec3, per: body,          arena: scratch, owner: data}
  - {name: body_aabb_hi,    dtype: vec3, per: body,          arena: scratch, owner: data}
  - {name: pair_count,      dtype: u32,  per: env,           arena: scratch, owner: data}
  - {name: candidate_pairs, dtype: u32,  per: contact_slot,  arena: scratch, owner: data, elem: 2}

  # =========================================================================
  # M5 — LBVH broadphase scratch (BuildAabbs/LbvhBuild/LbvhQueryPairs ops). The
  # per-env Karras LBVH builds over the env's body AABB set (env-major). Sized
  # per:body so a 2N-1-node tree (N = bodies_per_env) plus the Morton key/index
  # arrays fit one preallocated arena slice (NO per-call cudaMalloc on the
  # pair-driven path — the ports' thrust temp allocs stay, but the node/morton/
  # visit state is arena-resident, the plan §3.5 "preallocated arena scratch"
  # posture). lbvh_nodes packs the LbvhNode record (8 floats: left/right/parent
  # i32 + aabb 6 f32 = 36 B -> elem:9 f32 lanes covers it, 36 B/node). morton
  # codes + the stable index companion + the bottom-up visit counters are u32.
  # These are ONLY touched by the pair-driven family; the union slot-template
  # path early-exits before LbvhBuild (gate-pinned, bit-identical to M4).
  # =========================================================================
  - {name: lbvh_nodes,      dtype: f32,  per: body,          arena: scratch, owner: data, elem: 9}
  - {name: lbvh_morton,     dtype: u32,  per: body,          arena: scratch, owner: data}
  - {name: lbvh_index,      dtype: u32,  per: body,          arena: scratch, owner: data}
  - {name: lbvh_visit,      dtype: u32,  per: body,          arena: scratch, owner: data}
  - {name: contact_link,    dtype: u32,  per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_point,   dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_normal,  dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_depth,   dtype: f32,  per: contact_slot,  arena: scratch, owner: data}
  # Split tangent arrays (legacy tangent1_/tangent2_ buffers 1:1; the M3a packed
  # elem:2 contact_tangent was replaced — separate arrays keep the ported kernel
  # indexing textually identical).
  - {name: contact_tangent1,dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_tangent2,dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_material,dtype: u32,  per: contact_slot,  arena: scratch, owner: data}
  # Per-contact chain Jacobians (legacy jac_normal_/jac_tangent1_/jac_tangent2_,
  # [slot * dof_stride] row-major) + per-contact effective masses (legacy
  # meff_*_). per:slot_dof = max_contacts_per_env x dofs_per_env.
  - {name: jac_normal,         dtype: f32, per: slot_dof,     arena: scratch, owner: data}
  - {name: jac_tangent1,       dtype: f32, per: slot_dof,     arena: scratch, owner: data}
  - {name: jac_tangent2,       dtype: f32, per: slot_dof,     arena: scratch, owner: data}
  - {name: contact_meff_normal,   dtype: f32, per: contact_slot, arena: scratch, owner: data}
  - {name: contact_meff_tangent1, dtype: f32, per: contact_slot, arena: scratch, owner: data}
  - {name: contact_meff_tangent2, dtype: f32, per: contact_slot, arena: scratch, owner: data}
  # Per-slot contact force readout (legacy contact_force_, {Fn,Ft1,Ft2} per slot).
  - {name: contact_force,   dtype: f32,  per: contact_slot,  arena: scratch, owner: data, elem: 3, flags: [readout]}
  # M4 UNION-family manifold scratch: up to 4 points per contact slot (box x
  # plane emits a 4-corner patch; sphere classes emit 1). Kept SEPARATE from the
  # fused-family contact_* arrays above so the byte-exact ported foot kernels
  # keep their exact 1-point-per-slot layout.
  - {name: ucontact_count,  dtype: u32,  per: contact_slot,  arena: scratch, owner: data}
  - {name: ucontact_point,  dtype: vec3, per: contact_slot,  arena: scratch, owner: data, elem: 4}
  - {name: ucontact_normal, dtype: vec3, per: contact_slot,  arena: scratch, owner: data, elem: 4}
  - {name: ucontact_depth,  dtype: f32,  per: contact_slot,  arena: scratch, owner: data, elem: 4}

  # =========================================================================
  # UNIFIED ROW SOLVE (M4, union CSR family) — DATA.
  # urows: the per-row-slot NkRow record (src/nk/solve/nk_row.hpp, 32 f32 =
  # 128 B: flags/group/rhs/R/bounds/mu + both reaction sides incl. their 6-dof
  # contact Jacobians). Written by AssembleRows, read/λ-companion by
  # SolveRowsBlockIsland. chain_jacobian: per-(row_slot x dof) articulation
  # chain Jacobian row J (COALESCED row-major [slot*dof_stride + k] — within a
  # color, consecutive ROWS are touched by consecutive threads, and within one
  # row's serial k-loop the reads stream a contiguous 51-float line, the same
  # access shape the legacy kernels had). row_minv_jt: the PRECOMPUTED
  # w = M^-1 J^T companion (same layout) — assembly-time hoisting of the
  # ArticulationApplyImpulse inner loop (bit-equal: same inner products, same
  # order, computed once instead of per iteration). row_meff: per-row effective
  # mass 1/(invA+invB+R) (assembly-time hoisting of ComputeCompliantEffective-
  # Mass, constant across iterations). row_cj_*: the chain-Jacobian kernel
  # inputs gathered per row slot (contact link / world point / row direction).
  # qdot_flat: the per-env flat prefix-sum joint-velocity vector (packed from
  # link_velocity[root] + qdot before the solve, scattered back after).
  # row_count: the per-env ACTIVE row watermark.
  # =========================================================================
  - {name: row_count,       dtype: u32,  per: env,      arena: scratch,    owner: data}
  - {name: urows,           dtype: f32,  per: row_slot, arena: scratch,    owner: data, elem: 32}
  - {name: chain_jacobian,  dtype: f32,  per: row_dof,  arena: scratch,    owner: data}
  - {name: row_minv_jt,     dtype: f32,  per: row_dof,  arena: scratch,    owner: data}
  - {name: row_meff,        dtype: f32,  per: row_slot, arena: scratch,    owner: data}
  - {name: row_cj_link,     dtype: u32,  per: row_slot, arena: scratch,    owner: data}
  - {name: row_cj_point,    dtype: vec3, per: row_slot, arena: scratch,    owner: data}
  - {name: row_cj_dir,      dtype: vec3, per: row_slot, arena: scratch,    owner: data}
  - {name: qdot_flat,       dtype: f32,  per: dof,      arena: scratch,    owner: data}
  # Unfactored CRBA M tile (legacy m_; m_inv above is its LDL^T inverse) + the
  # CRBA composite-inertia scratch (legacy composite_).
  - {name: m,                      dtype: f32,   per: env_dof2, arena: scratch, owner: data}
  - {name: link_composite_inertia, dtype: mat36, per: link,     arena: scratch, owner: data}

  # =========================================================================
  # UNION CONTACT TEMPLATE + LIVE TOGGLES (M4) — the union-family contact-pair
  # tables. union_slots: GLOBAL per-env template table (shared by all envs),
  # 16 packed f32 per contact slot {class, local_link/body, p0..p13} — see
  # nk::UnionSlot (src/nk/model/model.hpp) for the packing. hull_verts: the
  # mesh-local convex-hull vertex pool (cup), xyz-packed. dof_to_link /
  # dof_to_component: the flat-DOF -> (template-local link, base component)
  # maps (the DofIndexOf prefix-sum inverse; component == ~0u for scalar
  # joints). table_enabled: the per-env LIVE cup x table emission toggle
  # (DATA — SetTableEnabled is a field write, never a graph rebuild).
  # =========================================================================
  - {name: union_slots,      dtype: f32, per: scalar, count: "max_contacts_per_env*16", arena: persistent, owner: model}
  - {name: hull_verts,       dtype: f32, per: scalar, count: "max_hull_verts*3",        arena: persistent, owner: model}
  - {name: dof_to_link,      dtype: u32, per: dof,    arena: persistent, owner: model}
  - {name: dof_to_component, dtype: u32, per: dof,    arena: persistent, owner: model}
  - {name: table_enabled,    dtype: u32, per: env,    arena: persistent, owner: data}

  # =========================================================================
  # M5 — PAIR-DRIVEN broadphase FILTER policy + generalized narrowphase shape
  # tables — MODEL (cook-constant). These back the pair-driven NarrowphasePrim/
  # NarrowphaseSdf path (the generalized rigid/mesh collision the union slot-
  # template family does NOT use). All GLOBAL (per-env template, base-relative).
  #
  # shape_table: the per-body collidable primitive record (8 packed f32 per
  # body-row {kind(u32 bits), p0..p3 (sphere r / capsule r,hh / box he.xyz),
  # contype(u32 bits), conaffinity(u32 bits), sdf_grid(u32 bits)}). The
  # NarrowphasePrimitives pair-driven branch dispatches by (kind_a,kind_b) over
  # the amf:: analytic set; sdf_grid != ~0 routes the pair through NarrowphaseSdf.
  # excluded_pairs: the SORTED (lo<<32|hi) exclude list (cook filter policy);
  # the pair query drops a candidate found by binary search. filter_excluded_count
  # is its live length (a scalar staged into mat-bucket-style header — kept as a
  # 1-row table so the op reads the count device-side without a host param).
  # =========================================================================
  - {name: shape_table,      dtype: f32, per: scalar, count: "max_bodies_total*8",       arena: persistent, owner: model}
  - {name: excluded_pairs,   dtype: u64, per: scalar, count: "max_excluded_pairs",       arena: persistent, owner: model}

  # =========================================================================
  # M5 — SDF main path (NarrowphaseSdf op; plan §3.5 Genesis-style sampling).
  # The OTHER shape's cooked SAMPLE-POINT set (hull verts + edge midpoints,
  # cooked into the .nka SAMP chunk) queried against the cooked sparse narrow-
  # band SDF grid (mirrors runtime/sdf CookedSdfTable / SparseSdfDevice layout).
  #   samp_points       : flat mesh-local sample-point pool (xyz packed).
  #   samp_ranges       : per body-row {offset, count} into samp_points (the
  #                        sampling shape's sample slice).
  #   sdf_headers        : per SDF grid record (8 f32: origin.xyz, voxel_size,
  #                        dims.xyz (u32 bits), cell_offset (u32 bits into the
  #                        flat cell arrays)).
  #   sdf_cell_count     : per SDF grid live cell count (u32).
  #   sdf_cell_keys      : flat ASCENDING-sorted PackSdfCellKey(i,j,k) (u64).
  #   sdf_cell_values    : flat signed distance at each cell (f32).
  #   sdf_cell_gradients : flat precomputed gradient at each cell (vec3).
  # All GLOBAL (shared by every env; the sampling shape's body pose makes the
  # query env-specific). The union family never references them (early-exit).
  # =========================================================================
  - {name: samp_points,       dtype: f32,  per: scalar, count: "max_samp_points*3",  arena: persistent, owner: model}
  - {name: samp_ranges,       dtype: u32,  per: scalar, count: "max_bodies_total*2", arena: persistent, owner: model}
  - {name: sdf_headers,       dtype: f32,  per: scalar, count: "max_sdf_grids*8",    arena: persistent, owner: model}
  - {name: sdf_cell_count,    dtype: u32,  per: scalar, count: "max_sdf_grids",      arena: persistent, owner: model}
  - {name: sdf_cell_keys,     dtype: u64,  per: scalar, count: "max_sdf_cells",      arena: persistent, owner: model}
  - {name: sdf_cell_values,   dtype: f32,  per: scalar, count: "max_sdf_cells",      arena: persistent, owner: model}
  - {name: sdf_cell_gradients,dtype: vec3, per: scalar, count: "max_sdf_cells",      arena: persistent, owner: model}

  # =========================================================================
  # SOLVE SCHEDULE (island/color) — MODEL. Built worst-case at World construct
  # by nk::SolveSchedule (the row_scheduler algorithms migrated to
  # src/nk/solve/schedule.cpp) over MAX-CAPACITY row slots, uploaded once,
  # device-resident, never recomputed per step (plan §3.4). Layout:
  #   row_order[k]              : global row-slot ids, grouped per island, in
  #                               ascending (color, intra-color) order.
  #   island_color_segments[s]  : {row_order offset, row count} u32 pair per
  #                               color segment.
  #   island_row_offsets[i]     : {segment offset, segment count, flags, env}
  #                               u32 quad per island (flags bit0 = island has
  #                               articulation rows -> owns the qdot scatter).
  # Capacities: islands <= row slots, segments <= row slots.
  # =========================================================================
  - {name: island_row_offsets,    dtype: u32, per: row_slot, arena: persistent, owner: model, elem: 4}
  - {name: island_color_segments, dtype: u32, per: row_slot, arena: persistent, owner: model, elem: 2}
  - {name: row_order,             dtype: u32, per: row_slot, arena: persistent, owner: model}

  # =========================================================================
  # PARTICLE (XPBD soft) — DATA. Source: XpbdWorld. particle_pos above (§3.3).
  # =========================================================================
  - {name: particle_prev_pos, dtype: vec3, per: particle, arena: persistent, owner: data}
  - {name: particle_vel,      dtype: vec3, per: particle, arena: persistent, owner: data, flags: [diff]}
  - {name: particle_inv_mass, dtype: f32,  per: particle, arena: persistent, owner: data, flags: [param]}

  # --- XPBD DISTANCE constraints (per dist_con) ---
  - {name: dist_particle_a,    dtype: u32, per: dist_con, arena: persistent, owner: model}
  - {name: dist_particle_b,    dtype: u32, per: dist_con, arena: persistent, owner: model}
  - {name: dist_rest_length,   dtype: f32, per: dist_con, arena: persistent, owner: model}
  - {name: dist_compliance,    dtype: f32, per: dist_con, arena: persistent, owner: model, flags: [param]}
  - {name: dist_lambda,        dtype: f32, per: dist_con, arena: persistent, owner: data}

  # --- XPBD BEND constraints (per bend_con; 4 particles + 4 gradient vecs) ---
  - {name: bend_particles,   dtype: u32,  per: bend_con, arena: persistent, owner: model, elem: 4}
  - {name: bend_gradients,   dtype: vec3, per: bend_con, arena: persistent, owner: model, elem: 4}
  - {name: bend_compliance,  dtype: f32,  per: bend_con, arena: persistent, owner: model, flags: [param]}
  - {name: bend_lambda,      dtype: f32,  per: bend_con, arena: persistent, owner: data}

  # --- XPBD VOLUME constraints (per vol_con; 4 particles) ---
  - {name: vol_particles,    dtype: u32, per: vol_con, arena: persistent, owner: model, elem: 4}
  - {name: vol_rest_times6,  dtype: f32, per: vol_con, arena: persistent, owner: model}
  - {name: vol_compliance,   dtype: f32, per: vol_con, arena: persistent, owner: model, flags: [param]}
  - {name: vol_lambda,       dtype: f32, per: vol_con, arena: persistent, owner: data}

  # =========================================================================
  # PARTICLE (PBF fluid) — DATA. Source: PbfWorld. The fluid shares particle_pos/
  # particle_vel with XPBD; PBF-specific scratch is predicted pos / density /
  # lambda / position deltas.
  # =========================================================================
  - {name: pbf_predicted_pos,  dtype: vec3, per: particle, arena: scratch, owner: data}
  - {name: pbf_position_delta, dtype: vec3, per: particle, arena: scratch, owner: data}
  - {name: pbf_density,        dtype: f32,  per: particle, arena: scratch, owner: data}
  - {name: pbf_lambda,         dtype: f32,  per: particle, arena: scratch, owner: data}

  # =========================================================================
  # M5 — PARTICLE UNIFORM-GRID scratch (ParticleGridBuild op; ported from
  # collision/particle_uniform_grid.cu). The hash-grid CSR neighbor structure
  # the M6 PBF/XPBD co-step queries. grid_cell_key/grid_particle_idx are the
  # per-particle (cell-key, original-index) pair the stable_sort orders (D1
  # radix anchor); grid_neighbor_offset is the per-particle CSR offset (the
  # exclusive-scan of the per-particle in-radius neighbor count, capped at
  # kParticleGridMaxNeighbors=32); grid_neighbor_count is the per-particle
  # active neighbor watermark; grid_neighbor_idx is the flat CSR neighbor pool
  # (32 slots/particle, the fixed cap so the slice is preallocated — no per-call
  # alloc). grid_cell_start/grid_cell_end are the per-cell [start,end) ranges
  # into the sorted index (sized per:particle as a conservative cell upper
  # bound; the op writes only the populated prefix). M6 wires the real PBF
  # consumer; M5 ships the build op + the arena-resident neighbor CSR it exposes.
  # =========================================================================
  - {name: grid_cell_key,       dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: grid_particle_idx,   dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: grid_cell_start,     dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: grid_cell_end,       dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: grid_neighbor_offset,dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: grid_neighbor_count, dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: grid_neighbor_idx,   dtype: u32, per: particle, arena: scratch, owner: data, elem: 32}

  # =========================================================================
  # DOMAIN RANDOMIZATION / RNG — DATA. mat_buckets/mat_index above (§3.3).
  # rng_state: per-env counter-based RNG state (Philox seed/counter).
  # =========================================================================
  - {name: rng_state,    dtype: u64, per: env, arena: persistent, owner: data, flags: [param]}

  # =========================================================================
  # READOUT / RL substrate — DATA. link_contact_wrench above (§3.3).
  # env_status: per-env status bits (overflow / termination), readable via
  # ExportObs. obs_buffer: the flat per-env whole-body observation export.
  # =========================================================================
  - {name: env_status,   dtype: u32, per: env, arena: scratch, owner: data, flags: [readout]}
  - {name: obs_buffer,   dtype: f32, per: env, arena: scratch, owner: data, flags: [readout], elem: 64}
