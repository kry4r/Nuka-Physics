
schema:
  dtype: [f32, u32, u64, u8, vec3, quat, transform, spatial6, mat36, symmat3]
  per:   [env, dof, link, body, contact_slot, row_slot, slot_dof, row_dof, particle, env_dof2, scalar, articulation, articulation_dof2, articulation_dof, aero_tri]
  arena: [persistent, scratch]
  owner: [model, data]
  flags: [param, readout]

fields:
  - {name: q,             dtype: f32,       per: link,         arena: persistent, owner: data}
  - {name: qdot,          dtype: f32,       per: link,         arena: persistent, owner: data}
  - {name: link_pose,     dtype: transform, per: link,         arena: persistent, owner: data}
  # base_pose is per-ARTICULATION (the FK/integrate kernels read base_pose[articulation],
  # one root pose per co-resident dog). K==1 (1 artic/env) collapses to per:env bytes.
  - {name: base_pose,     dtype: transform, per: articulation, arena: persistent, owner: data}
  - {name: body_pose,     dtype: transform, per: body,         arena: persistent, owner: data}
  - {name: body_inv_mass, dtype: f32,       per: body,         arena: persistent, owner: data,  flags: [param]}
  - {name: contact_count, dtype: u32,       per: env,          arena: scratch,    owner: data}
  - {name: lambda,        dtype: f32,       per: row_slot,     arena: persistent, owner: data}
  - {name: articulation_bias, dtype: f32, per: articulation_dof, arena: scratch, owner: data}
  - {name: m_factor,         dtype: f32,       per: articulation_dof2, arena: scratch, owner: data}
  - {name: particle_pos,  dtype: vec3,      per: particle,     arena: persistent, owner: data}
  - {name: mat_buckets,   dtype: f32,       per: scalar, count: "num_buckets*22*env_count", arena: persistent, owner: data, flags: [param]}
  - {name: mat_index,     dtype: u32,       per: body,         arena: persistent, owner: data,  flags: [param]}
  - {name: link_contact_wrench, dtype: spatial6, per: link,    arena: scratch,    owner: data,  flags: [readout]}

  # =========================================================================
  # ARTICULATION dynamics state — DATA (mutable per-step Featherstone state).
  # Source: ArticulationDeviceState (articulation_state.hpp). q/qdot/base_pose/
  # link_pose already declared above (the §3.3 examples). The rest follow 1:1.
  # =========================================================================
  - {name: qddot,                 dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: tau,                   dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: link_velocity,         dtype: spatial6,  per: link, arena: persistent, owner: data}
  # A spherical joint's rotation (child in parent joint frame) and its three DOF velocities in the child frame.
  - {name: joint_rotation,        dtype: quat,      per: link, arena: persistent, owner: data}
  - {name: joint_angular_velocity, dtype: vec3,     per: link, arena: persistent, owner: data}
  - {name: link_acceleration,     dtype: spatial6,  per: link, arena: scratch,    owner: data}
  - {name: link_velocity_bias,    dtype: spatial6,  per: link, arena: scratch,    owner: data}
  - {name: link_xup,              dtype: mat36,     per: link, arena: scratch,    owner: data}
  - {name: link_bias_force,       dtype: spatial6,  per: link, arena: scratch,    owner: data}
  # joint_motion_subspace is DATA (scratch), not a model table: ABA Pass-1
  # REWRITES it every step (MotionSubspaceForJoint / the floating-base Zero6)
  # before the CRBA reads it — a 1:1 port of the legacy mutable buffer.
  - {name: joint_motion_subspace, dtype: spatial6,  per: link, arena: scratch,    owner: data}
  # PD drive state (legacy batched articulated drive_* device arrays,
  # link-major). drive_target is the RL action surface; the other three are
  # cook-seeded hold-drive params (randomizable later).
  - {name: drive_target,          dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  - {name: drive_stiffness,       dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  - {name: drive_damping,         dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  - {name: drive_force_limit,     dtype: f32,       per: link, arena: persistent, owner: data,  flags: [param]}
  - {name: drive_joint_force_limit, dtype: f32,     per: link, arena: persistent, owner: data,  flags: [param]}
  # Reset/snapshot state (device-resident; backs SnapshotState/RestoreState/
  # ResetEnvs ops — the legacy batched articulated snapshot_* buffers 1:1).
  - {name: snapshot_q,             dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: snapshot_qdot,          dtype: f32,       per: link, arena: persistent, owner: data}
  - {name: snapshot_link_velocity, dtype: spatial6,  per: link, arena: persistent, owner: data}
  - {name: snapshot_joint_rotation, dtype: quat,     per: link, arena: persistent, owner: data}
  - {name: snapshot_joint_angular_velocity, dtype: vec3, per: link, arena: persistent, owner: data}
  # snapshot_base_pose mirrors base_pose 1:1 (the Reset restore source), so it MUST
  # carry the same per:articulation count (else SnapshotState/RestoreState would
  # round-trip a size mismatch). K==1 collapses to per:env bytes.
  - {name: snapshot_base_pose,     dtype: transform, per: articulation, arena: persistent, owner: data}
  - {name: snapshot_body_pose,             dtype: transform, per: body, arena: persistent, owner: data}
  - {name: snapshot_body_linear_velocity,  dtype: vec3,      per: body, arena: persistent, owner: data}
  - {name: snapshot_body_angular_velocity, dtype: vec3,      per: body, arena: persistent, owner: data}
  - {name: reset_env_ids,          dtype: u32,       per: env,  arena: scratch,    owner: data}

  # =========================================================================
  # ARTICULATION topology / inertia / templates — MODEL (cook-constant).
  # Source: ArticulationDeviceState constant arrays + ArticulationCookedTopology.
  # These are packed into the ONE Model device buffer and exposed via ModelView.
  # =========================================================================
  - {name: link_inertia,          dtype: mat36,     per: link, arena: persistent, owner: model}
  - {name: link_local_pose,       dtype: transform, per: link, arena: persistent, owner: model}
  - {name: link_inertial_frame,   dtype: transform, per: link, arena: persistent, owner: model}
  - {name: joint_axis,            dtype: vec3,      per: link, arena: persistent, owner: model}
  - {name: parent_offset,         dtype: vec3,      per: link, arena: persistent, owner: model}
  - {name: joint_type,            dtype: u8,        per: link, arena: persistent, owner: model}
  - {name: parent_link,           dtype: u32,       per: link, arena: persistent, owner: model}
  - {name: link_body,             dtype: u32,       per: link, arena: persistent, owner: model}
  - {name: link_to_articulation,  dtype: u32,       per: link, arena: persistent, owner: model}
  - {name: joint_damping,         dtype: f32,       per: link, arena: persistent, owner: model, flags: [param]}
  - {name: joint_armature,        dtype: f32,       per: link, arena: persistent, owner: model, flags: [param]}
  # per-ARTICULATION offset tables (one entry per co-resident articulation; the CRBA
  # / ABA / assemble kernels index articulation_link_offset[articulation]). With K
  # dogs co-resident in one env there are K entries/env; at K==1 (1 artic == 1 env)
  # the count is articulations_per_env == 1 == per:env, so the bytes are identical.
  - {name: articulation_link_count,  dtype: u32, per: articulation, arena: persistent, owner: model}
  - {name: articulation_link_offset, dtype: u32, per: articulation, arena: persistent, owner: model}
  # Shared foot rows use base-relative link indices and five scalars per foot:
  # calf-local-link bits, local offset.xyz and radius.
  - {name: foot_shape, dtype: f32, per: scalar, count: "foot_shape_count*5", arena: persistent, owner: model}

  # =========================================================================
  # RIGID BODY SoA — DATA. Source: runtime::rigid::BodyState. body_pose +
  # body_inv_mass declared above (§3.3). The remaining BodyState members follow.
  # body_pose carries position+orientation; here we keep the linear/angular vel,
  # accumulated force/torque, and the inverse-inertia diag.
  # =========================================================================
  - {name: body_linear_velocity,  dtype: vec3, per: body, arena: persistent, owner: data}
  - {name: body_angular_velocity, dtype: vec3, per: body, arena: persistent, owner: data}
  # World-frame COM force [N] and torque [N*m] for dynamic free-body owners.
  # Velocity integration consumes and clears these transient inputs each step.
  - {name: body_force,            dtype: vec3, per: body, arena: scratch,    owner: data}
  - {name: body_torque,           dtype: vec3, per: body, arena: scratch,    owner: data}
  - {name: body_inv_inertia,      dtype: vec3, per: body, arena: persistent, owner: data, flags: [param]}

  # =========================================================================
  # BROADPHASE / NARROWPHASE scratch — DATA. AABB set + candidate pairs +
  # contact manifold. row_count is the row watermark companion of contact_count.
  # =========================================================================
  - {name: body_aabb_lo,    dtype: vec3, per: body,          arena: scratch, owner: data}
  - {name: body_aabb_hi,    dtype: vec3, per: body,          arena: scratch, owner: data}
  - {name: pair_count,      dtype: u32,  per: env,           arena: scratch, owner: data}
  - {name: candidate_pairs, dtype: u32,  per: contact_slot,  arena: scratch, owner: data, elem: 2}

  # =========================================================================
  # M5 — LBVH broadphase scratch (BuildAabbs/LbvhBuild/LbvhQueryPairs ops). The
  # per-env Karras LBVH builds over the env's body AABB set (env-major). Sized
  # per:body so a 2N-1-node tree (N = bodies_per_env) plus the Morton key/index
  # arrays fit one preallocated arena slice (NO per-call cudaMalloc on the
  # pair-driven path — the ports' thrust temp allocs stay, but the node/morton/
  # visit state is arena-resident, the plan §3.5 "preallocated arena scratch"
  # posture). lbvh_nodes packs the LbvhNode record (8 floats: left/right/parent
  # i32 + aabb 6 f32 = 36 B -> elem:9 f32 lanes covers it, 36 B/node). morton
  # codes + the stable index companion + the bottom-up visit counters are u32.
  # These are ONLY touched by the pair-driven family; the union slot-template
  # path early-exits before LbvhBuild (gate-pinned, bit-identical to M4).
  # =========================================================================
  # lbvh_nodes: the per-env Karras tree has 2N-1 nodes (N internal-1 + N leaves),
  # NOT N. It was sized per:body (N nodes/env) which UNDERSIZED the array by N-1
  # nodes/env -> the build wrote node[2N-2] past the segment (a latent bug, inert
  # until the first PairDriven world runs). FIX: per:scalar with the explicit
  # env_count*(2*max_bodies_total-1) node count (the kernel's nbase = env*(2N-1)
  # stride). 9 f32 lanes/node (left/right/parent i32 + aabb 6 f32 = 36 B). The
  # morton/index/visit companions stay per:body (one entry/body, the correct N).
  - {name: lbvh_nodes,      dtype: f32,  per: scalar, count: "lbvh_node_count",  arena: scratch, owner: data}
  - {name: lbvh_morton,     dtype: u32,  per: body,          arena: scratch, owner: data}
  - {name: lbvh_index,      dtype: u32,  per: body,          arena: scratch, owner: data}
  - {name: lbvh_visit,      dtype: u32,  per: body,          arena: scratch, owner: data}
  # Compound (env<<32)|morton30 key so ONE stable_sort_by_key orders every env in
  # a single call (env in the high bits keeps envs disjoint, morton in the low).
  - {name: lbvh_sortkey,    dtype: u64,  per: body,          arena: scratch, owner: data}
  - {name: contact_link,    dtype: u32,  per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_point,   dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_normal,  dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_depth,   dtype: f32,  per: contact_slot,  arena: scratch, owner: data}
  # Split tangent arrays (legacy tangent1_/tangent2_ buffers 1:1; the M3a packed
  # elem:2 contact_tangent was replaced — separate arrays keep the ported kernel
  # indexing textually identical).
  - {name: contact_tangent1,dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_tangent2,dtype: vec3, per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_material,dtype: u64,  per: contact_slot,  arena: scratch, owner: data}
  - {name: contact_force,   dtype: f32,  per: contact_slot,  arena: scratch, owner: data, elem: 3, flags: [readout]}
  - {name: ucontact_count,  dtype: u32,  per: contact_slot,  arena: scratch, owner: data}
  - {name: ucontact_point,  dtype: vec3, per: contact_slot,  arena: scratch, owner: data, elem: 4}
  - {name: ucontact_witness_a, dtype: vec3, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: ucontact_witness_b, dtype: vec3, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: ucontact_normal, dtype: vec3, per: contact_slot,  arena: scratch, owner: data, elem: 4}
  - {name: ucontact_depth,  dtype: f32,  per: contact_slot,  arena: scratch, owner: data, elem: 4}

  - {name: row_count,       dtype: u32,  per: env,      arena: scratch,    owner: data}
  - {name: urows,           dtype: f32,  per: row_slot, arena: scratch,    owner: data, elem: 26}
  - {name: row_contact_response, dtype: symmat3, per: row_slot, arena: scratch, owner: data}
  - {name: chain_jacobian,  dtype: f32,  per: row_dof,  arena: scratch,    owner: data}
  - {name: row_reference_velocity_gain, dtype: f32, per: row_slot, arena: scratch, owner: data}
  - {name: row_invweight, dtype: f32, per: row_slot, arena: scratch, owner: data}
  - {name: row_cj_link,     dtype: u32,  per: row_slot, arena: scratch,    owner: data}
  - {name: row_cj_point,    dtype: vec3, per: row_slot, arena: scratch,    owner: data}
  - {name: qdot_flat,       dtype: f32,  per: articulation_dof, arena: scratch, owner: data}
  - {name: m,                      dtype: f32,   per: articulation_dof2, arena: scratch, owner: data}
  - {name: link_composite_inertia, dtype: mat36, per: link,     arena: scratch, owner: data}

  # =========================================================================
  # SHARED GENERAL-PATH TABLES (formerly the M4 union block). L1-c DELETED the
  # union-only fields union_slots (the per-env contact-pair template) and
  # table_enabled (the cup x table live emission toggle). The survivors below are
  # SHARED by the ONE general (PairDriven) path: hull_verts is the mesh-local
  # convex-hull vertex pool (xyz-packed, read by the PairDriven narrowphase);
  # dof_to_link / dof_to_component are the flat-DOF -> (template-local link, base
  # component) maps (the DofIndexOf prefix-sum inverse; component == ~0u for
  # scalar joints), read by the general row assembly.
  # =========================================================================
  - {name: hull_verts,       dtype: f32, per: scalar, count: "max_hull_verts*3",        arena: persistent, owner: model}
  - {name: dof_to_link,      dtype: u32, per: dof,    arena: persistent, owner: model}
  - {name: dof_to_component, dtype: u32, per: dof,    arena: persistent, owner: model}

  # =========================================================================
  # M5 — PAIR-DRIVEN broadphase FILTER policy + generalized narrowphase shape
  # tables — MODEL (cook-constant). These back the pair-driven NarrowphasePrim/
  # NarrowphaseSdf path (the generalized rigid/mesh collision the union slot-
  # template family does NOT use). All GLOBAL (per-env template, base-relative).
  #
  # shape_table: the per-body collidable primitive record. R1 (general contact
  # pipeline Phase 0) GREW the record from 8 to 10 packed f32 per body-row,
  # APPENDING two lanes after the original 8 so the unpack of lanes 0..7 is
  # byte-identical:
  #   {kind(u32 bits), p0..p3 (sphere r / capsule r,hh / box he.xyz),
  #    contype(u32 bits), conaffinity(u32 bits), sdf_grid(u32 bits),
  #    body_id(int32 bits; -1 == static), group(u32 bits)}.
  # body_id resolves each collidable to its owning body row (the shape->body
  # indirection); -1 marks a static collidable (ground plane / heightfield) that
  # contributes no reaction side. group is the signed collision-group filter
  # (Newton broad_phase test_group_pair). The NarrowphasePrimitives pair-driven
  # branch dispatches by (kind_a,kind_b) over the amf:: analytic set; sdf_grid
  # != ~0 routes the pair through NarrowphaseSdf.
  # L-RECON-D (general contact pipeline) GREW the record 10 -> 12, APPENDING the
  # per-shape hull slice {hull_vert_offset(u32 bits), hull_vert_count(u32 bits)}
  # into lanes 10/11 so the cvx narrowphase uses THIS shape's verts (its slice of
  # the concatenated hull_verts pool) — count 0 == not a hull row (NO-OP for a
  # hull-free scene, e.g. go2). Lanes 0..9 stay byte-identical.
  # excluded_pairs: the SORTED (lo<<32|hi) exclude list (cook filter policy);
  # the pair query drops a candidate found by binary search. filter_excluded_count
  # is its live length (a scalar staged into mat-bucket-style header — kept as a
  # 1-row table so the op reads the count device-side without a host param).
  # =========================================================================
  - {name: shape_table,      dtype: f32, per: scalar, count: "max_bodies_total*13",      arena: persistent, owner: model}
  - {name: excluded_pairs,   dtype: u64, per: scalar, count: "max_excluded_pairs",       arena: persistent, owner: model}
  # Authored contact pairs: sorted (lo<<32|hi) collidable-row keys and the contact profile each pair uses.
  - {name: contact_pair_keys,     dtype: u64, per: scalar, count: "max_contact_pairs", arena: persistent, owner: model}
  - {name: contact_pair_profiles, dtype: u32, per: scalar, count: "max_contact_pairs", arena: persistent, owner: model}

  # =========================================================================
  # M5 — SDF main path (NarrowphaseSdf op; plan §3.5 Genesis-style sampling).
  # The OTHER shape's cooked SAMPLE-POINT set (hull verts + edge midpoints,
  # cooked into the .nka SAMP chunk) queried against the cooked sparse narrow-
  # band SDF grid (mirrors runtime/sdf CookedSdfTable / SparseSdfDevice layout).
  #   samp_points       : flat mesh-local sample-point pool (xyz packed).
  #   samp_ranges       : per body-row {offset, count} into samp_points (the
  #                        sampling shape's sample slice).
  #   sdf_headers        : per SDF grid record (8 f32: origin.xyz, voxel_size,
  #                        dims.xyz (u32 bits), cell_offset (u32 bits into the
  #                        flat cell arrays)).
  #   sdf_cell_count     : per SDF grid live cell count (u32).
  #   sdf_cell_keys      : flat ASCENDING-sorted PackSdfCellKey(i,j,k) (u64).
  #   sdf_cell_values    : flat signed distance at each cell (f32).
  #   sdf_cell_gradients : flat precomputed gradient at each cell (vec3).
  # All GLOBAL (shared by every env; the sampling shape's body pose makes the
  # query env-specific). The union family never references them (early-exit).
  # =========================================================================
  - {name: samp_points,       dtype: f32,  per: scalar, count: "max_samp_points*3",  arena: persistent, owner: model}
  - {name: samp_ranges,       dtype: u32,  per: scalar, count: "max_bodies_total*2", arena: persistent, owner: model}
  - {name: sdf_headers,       dtype: f32,  per: scalar, count: "max_sdf_grids*8",    arena: persistent, owner: model}
  - {name: sdf_cell_count,    dtype: u32,  per: scalar, count: "max_sdf_grids",      arena: persistent, owner: model}
  - {name: sdf_cell_keys,     dtype: u64,  per: scalar, count: "max_sdf_cells",      arena: persistent, owner: model}
  - {name: sdf_cell_values,   dtype: f32,  per: scalar, count: "max_sdf_cells",      arena: persistent, owner: model}
  - {name: sdf_cell_gradients,dtype: vec3, per: scalar, count: "max_sdf_cells",      arena: persistent, owner: model}

  # =========================================================================
  # PARTICLE (soft) — DATA. Source: nk soft ops. particle_pos above (§3.3).
  # =========================================================================
  - {name: particle_prev_pos, dtype: vec3, per: particle, arena: persistent, owner: data}
  - {name: particle_vel,      dtype: vec3, per: particle, arena: persistent, owner: data}
  - {name: particle_inv_mass, dtype: f32,  per: particle, arena: persistent, owner: data, flags: [param]}
  # Current projected velocity reference; subtract it to apply each new contact increment once.
  - {name: particle_v_pre,    dtype: vec3, per: particle, arena: scratch,    owner: data}

  # =========================================================================
  # CLOTH AERODYNAMIC DRAG — MODEL. Per surface triangle: the 3 particle indices
  # and the rest-space area. The drag op forms each triangle's outward normal +
  # mean velocity and applies an anisotropic (normal-dominant) quadratic air force
  # as a pre-solve velocity impulse. 0 triangles (the default) => the op is never
  # emitted, so a drag-free cook is byte-identical.
  # =========================================================================
  - {name: aero_tri_verts,    dtype: u32,  per: aero_tri, arena: persistent, owner: model, elem: 3}
  - {name: aero_tri_area,     dtype: f32,  per: aero_tri, arena: persistent, owner: model}

  # Shared working positions for all row-coupled particle materials; committed once at finalize.
  - {name: pbf_predicted_pos,  dtype: vec3, per: particle, arena: scratch, owner: data}

  # =========================================================================
  # DOMAIN RANDOMIZATION / RNG — DATA. mat_buckets/mat_index above (§3.3).
  # rng_state: per-env counter-based RNG state (Philox seed/counter).
  # =========================================================================
  - {name: rng_state,    dtype: u64, per: env, arena: persistent, owner: data, flags: [param]}

  # =========================================================================
  # READOUT / RL substrate — DATA. link_contact_wrench above (§3.3).
  # env_status: per-env status bits (overflow / termination), readable via
  # ExportObs. obs_buffer: the flat per-env whole-body observation export.
  # =========================================================================
  - {name: env_status,   dtype: u32, per: env, arena: scratch, owner: data, flags: [readout]}
  # obs_buffer width is the cook-derived obs_width (base pose + q + qdot per link),
  # NOT a baked 64, so a wide policy is not silently truncated. Model resolves the
  # symbolic count from capacities.obs_width at layout time.
  - {name: obs_buffer,   dtype: f32, per: scalar, count: "obs_width*env_count", arena: scratch, owner: data, flags: [readout]}

  # =========================================================================
  # PROCEDURAL TERRAIN (Go2-on-stairs demo, Phase 1) — DATA. Per-env terrain
  # TYPE code (nuka::terrain::TerrainType: 0=Flat .. 3=RandomBoxes). The
  # FusedFoot DetectFootGroundContacts kernel samples the SHARED procedural
  # heightfield h(x,y) (src/sensor/terrain/terrain_field.hpp) instead of the
  # scalar ground plane; type 0 (the DEFAULT seed) makes SampleTerrainHeight
  # return exactly ground_height, so the contact path is byte-identical to the
  # legacy scalar plane (the D1 guarantee). The TerrainParams (step_height etc.)
  # ride the NarrowphasePrimitives op params (model-level cook config), NOT a
  # device field. Persistent + owner:data so it round-trips Reset (snapshot) and
  # a caller/training harness can SET it post-cook via
  # World::GetData().UploadField(FieldId::EnvTerrainType, ...). Default 0 (flat)
  # is seeded by World::SeedInitialState (mirrors the table_enabled seed).
  # =========================================================================
  - {name: env_terrain_type, dtype: u32, per: env, arena: persistent, owner: data}
  # =========================================================================
  # PROCEDURAL TERRAIN (Go2-on-stairs demo, Phase 2a) — DATA. Per-env terrain
  # DIFFICULTY scale (f32) for the locomotion curriculum: the FusedFoot
  # DetectFootGroundContacts kernel multiplies the terrain step_height +
  # grid_height_max by this env's difficulty (via the SHARED
  # nuka::terrain::ScaleTerrainDifficulty helper, also used by the render
  # tessellator so physics + render never drift) BEFORE sampling the heightfield.
  # DEFAULT 1.0 (seeded by World::SeedInitialState) == the unscaled terrain. For
  # the type-0 (Flat) default seed SampleTerrainHeight ignores step/grid entirely
  # and returns ground_height, so the difficulty multiply is computed-but-unused
  # and the flat contact path stays byte-identical to the legacy scalar plane
  # (the D1 guarantee). A curriculum/training harness varies it per-env post-cook
  # via World::GetData().UploadField(FieldId::EnvTerrainDifficulty, ...).
  # Persistent + owner:data so it round-trips Reset (the construction snapshot).
  # =========================================================================
  - {name: env_terrain_difficulty, dtype: f32, per: env, arena: persistent, owner: data}
  - {name: joint_f, dtype: f32, per: link, arena: persistent, owner: data, flags: [param]}
  # =========================================================================
  # PER-LINK COLLISION GEOMETRY (general body<->body contact source) —
  # MODEL (immutable cook product). One primitive collision shape per
  # articulation link, in the link's LOCAL frame, so the GENERAL contact path's
  # SyncLinkBodyPose op (NkOp::SyncLinkBodyPose, PairDriven-family-gated) can pose
  # each link's collidable into its body row in WORLD space from the FK link_pose
  # field (link_pose o link_geom_local -> a collidable visible to the LBVH
  # broadphase) so artic links collide body<->body through the ONE cvx GJK/EPA
  # narrowphase + mixed-island solve. APPENDED LAST so every existing field keeps
  # its byte offset (layout-safe). These are inert for the FusedFoot/UnionCsr
  # graphs (only SyncLinkBodyPose reads them), and a link with no cooked collision
  # shape carries link_geom_kind == 0 (inactive sentinel) so it never produces a
  # collidable. Single-dog FUSED scenes therefore hit the identical op graph +
  # byte layout (the D1 guarantee).
  #   link_geom_kind   : scene::ShapeType (0 == none/inactive; Sphere/Box/
  #                      Capsule are the supported primitives). u32 per link.
  #   link_geom_params : packed primitive params, 4 f32 per link:
  #                        Sphere  -> [radius, 0, 0, 0]
  #                        Capsule -> [radius, half_height, 0, 0]  (axis = local Z)
  #                        Box     -> [hx, hy, hz, 0]
  #   link_geom_local  : the shape's LOCAL transform relative to its owning link.
  # =========================================================================
  - {name: link_geom_kind,   dtype: u32,       per: link, arena: persistent, owner: model}
  - {name: link_geom_params, dtype: f32,       per: link, arena: persistent, owner: model, elem: 4}
  - {name: link_geom_local,  dtype: transform, per: link, arena: persistent, owner: model}

  # --- R3: shape->body inverse tables (the assembly seam input). MODEL, per-body.
  # link_body[link] is link->body; the general PairDriven row-emission (S5) needs
  # the inverse body->owner so a contact's collidable id resolves to (articulation,
  # link) or (free-rigid) or (static). For each TEMPLATE link l with owning body
  # row b == link_body[l]:  body_to_link[b] = l (template-local link index) and
  # body_to_articulation[b] = local_artic_of(l). A body row that is NOT an
  # articulation link (free rigid / static) carries ~0u in BOTH (so the side
  # resolves free-rigid; the body_id == -1 in shape_table resolves static). Both
  # tile env-major like link_body (template-local values; the runtime adds the
  # per-env body/artic offset where it indexes globally). At K==1 the values are
  # stable. Empty for a cook with no articulation -> StampPerBody leaves ~0u.
  - {name: body_to_link,         dtype: u32, per: body, arena: persistent, owner: model}
  - {name: body_to_articulation, dtype: u32, per: body, arena: persistent, owner: model}

  # --- C1: per-slot collidable-id fields on the unified contact buffer. DATA,
  # per contact_slot, elem:4 to match the <=4-pt manifold (one (a,b) pair + a
  # generation per manifold point). ucontact_a/ucontact_b carry the two collidable
  # (body-row) ids each emitted contact point belongs to (so the assembly can
  # resolve both sides from the contact); ucontact_gen is a generation counter for
  # the future collide-once / reuse-across-substeps optimization. Siblings of the
  # ucontact_point/normal/depth scratch (fields above). INERT in Phase 0: the
  # PairDriven narrowphase does not stamp them yet (C2, Phase 1).
  # C3 (frame decision): ucontact_point is stored in WORLD space, ucontact_normal
  # (A->B) in WORLD space — the ONE documented representation feeding AssembleRows
  # (the chain-J kernel consumes a world point + world normal directly). See
  # ComputeContactChainJacobianKernel in assemble_rows.cu for the rationale.
  - {name: ucontact_a,   dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: ucontact_b,   dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: ucontact_gen, dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}

  # --- H1: general heightfield collidable height grid. MODEL, per:scalar. A flat
  # height grid the general heightfield collidable samples (Newton HeightfieldData
  # `heights`). The HeightfieldData POD {origin, cell_size, nrow, ncol, min_z,
  # max_z, data_offset} lives in model.hpp; this is the backing flat grid (one
  # f32 per cell-corner, row-major r*ncol+c). DATA POD + FIELD ONLY in Phase 0 —
  # the cook does NOT fill it (H2) and no contact kernel reads it (H3) yet, so
  # max_heightfield_cells == 0 for every current scene and the segment is
  # zero-bytes (the field is byte-inert). Sized max_heightfield_cells from the
  # scene at cook (H2, Phase 2).
  - {name: heights, dtype: f32, per: scalar, count: "max_heightfield_cells", arena: persistent, owner: model}

  - {name: chain_jacobian_b, dtype: f32,  per: row_dof,  arena: scratch, owner: data}
  - {name: row_cj_link_b,    dtype: u32,  per: row_slot, arena: scratch, owner: data}
  - {name: row_cj_point_b,   dtype: vec3, per: row_slot, arena: scratch, owner: data}

  # =========================================================================
  # Split-impulse position-correction pass: SEPARATE pseudo-velocity buffers
  # (never the persisted velocity state). The solve op runs pos_iters Gauss-
  # Seidel sweeps that drive a pseudo velocity from the geometric penetration
  # depth into these buffers; IntegratePosition advances position by
  # (real+pseudo)*dt while the persisted velocity stays = real. row_penetration
  # is the per-normal-row geometric depth the assembly already has as `pos`.
  # All pos_iters==0 (Union/Fused) paths leave these zero -> byte-identical
  # integration. APPENDED LAST so every pre-existing arena offset is byte-stable.
  # =========================================================================
  - {name: row_penetration,        dtype: f32,      per: row_slot, arena: scratch, owner: data}
  - {name: qdot_pseudo,            dtype: f32,      per: link,     arena: scratch, owner: data}
  - {name: link_velocity_pseudo,   dtype: spatial6, per: link,     arena: scratch, owner: data}
  - {name: qdot_pseudo_flat,       dtype: f32,      per: articulation_dof, arena: scratch, owner: data}
  - {name: body_pseudo_linear_velocity,  dtype: vec3, per: body,     arena: scratch, owner: data}
  - {name: body_pseudo_angular_velocity, dtype: vec3, per: body,     arena: scratch, owner: data}
  - {name: particle_pseudo_vel,    dtype: vec3,     per: particle, arena: scratch, owner: data}
  - {name: row_pseudo_lambda,      dtype: f32,      per: row_slot, arena: scratch, owner: data}

  # =========================================================================
  # Per-slot side-kind tag for the unified contact buffer's a/b index channel.
  # DATA, per contact_slot, elem:4 (one tag per <=4-pt manifold point, matching
  # ucontact_a/ucontact_b). The tag (nk::kUContactSide*) declares what the paired
  # ucontact_a/ucontact_b index ADDRESSES — a body-local collidable row or a
  # global particle id — so the row assembly resolves a side before the
  # shape_table body-row lookup, never aliasing a particle id into the body-row
  # space. The narrowphase writers stamp the body default for every slot they
  # emit; the zero-init scratch default is also the body meaning, so a slot
  # resolves exactly as before. APPENDED LAST so every pre-existing arena offset
  # is byte-stable (the D1 invariant).
  - {name: ucontact_a_kind, dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: ucontact_b_kind, dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}

  # =========================================================================
  # Particle reset/snapshot state (the restore source for a coupled-world Reset):
  # mirror the LIVE particle_pos / particle_prev_pos / particle_vel (per:particle)
  # 1:1 so SnapshotState/RestoreState round-trip the cloth/fluid slice, not just
  # the robot. A particle-free world sizes these zero -> the snapshot/restore is a
  # genuine no-op (byte-identical). APPENDED LAST so every pre-existing arena
  # offset is byte-stable (the D1 invariant).
  # =========================================================================
  - {name: snapshot_particle_pos,      dtype: vec3, per: particle, arena: persistent, owner: data}
  - {name: snapshot_particle_prev_pos, dtype: vec3, per: particle, arena: persistent, owner: data}
  - {name: snapshot_particle_vel,      dtype: vec3, per: particle, arena: persistent, owner: data}

  # MLS-MPM env-private background grid (dense Cartesian nodes; scratch, rebuilt
  # every transfer). 0 nodes for a non-MPM world -> zero-byte segment. APPENDED LAST.
  - {name: grid_mass,     dtype: f32,  per: scalar, count: "mpm_grid_nodes_per_env*env_count", arena: scratch, owner: data}
  - {name: grid_momentum, dtype: vec3, per: scalar, count: "mpm_grid_nodes_per_env*env_count", arena: scratch, owner: data}
  - {name: grid_velocity, dtype: vec3, per: scalar, count: "mpm_grid_nodes_per_env*env_count", arena: scratch, owner: data}
  - {name: grid_force,    dtype: vec3, per: scalar, count: "mpm_grid_nodes_per_env*env_count", arena: scratch, owner: data}

  # MLS-MPM per-particle continuum state (F deformation gradient init I, C APIC
  # affine init 0, vol0 lattice volume, plastic hardening, material_id). APPENDED LAST.
  - {name: particle_F,           dtype: f32, per: particle, arena: persistent, owner: data, elem: 9}
  - {name: particle_C,           dtype: f32, per: particle, arena: persistent, owner: data, elem: 9}
  - {name: particle_vol0,        dtype: f32, per: particle, arena: persistent, owner: data}
  - {name: particle_plastic,     dtype: f32, per: particle, arena: persistent, owner: data}
  - {name: particle_material_id, dtype: u32, per: particle, arena: persistent, owner: data}

  # MLS-MPM snapshot triple for the mutable F/C/plastic (the Reset restore source;
  # vol0/material_id are cook-constant, not snapshotted). APPENDED LAST.
  - {name: snapshot_particle_F,       dtype: f32, per: particle, arena: persistent, owner: data, elem: 9}
  - {name: snapshot_particle_C,       dtype: f32, per: particle, arena: persistent, owner: data, elem: 9}
  - {name: snapshot_particle_plastic, dtype: f32, per: particle, arena: persistent, owner: data}

  # MLS-MPM deterministic scratch shared sequentially by P2G particle sorting,
  # active-node compaction, and body-reaction node grouping (cub temp + sorted key/idx
  # out buffers, sized at World construct -> no mid-capture cudaMalloc). APPENDED LAST.
  - {name: mpm_grid_cell_key,  dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: mpm_grid_part_idx,  dtype: u32, per: particle, arena: scratch, owner: data}
  - {name: mpm_sort_scratch,   dtype: u8,  per: scalar, count: "mpm_grid_sort_scratch_bytes", arena: scratch, owner: data}
  # Per-particle Kirchhoff stress cache. Constitutive stress depends on F/C/material,
  # not on the destination node, so P2G computes it once per particle/substep instead
  # of repeating the same SVD for every one of the 3^3 stencil nodes.
  - {name: mpm_particle_stress, dtype: f32, per: particle, arena: scratch, owner: data, elem: 9}

  # MLS-MPM material table (global flat f32 pool like mat_buckets; stride
  # MpmMaterial::kValueCount, resolved in ElementCount). APPENDED LAST.
  - {name: mpm_material_table, dtype: f32, per: scalar, count: "mpm_material_count*11", arena: persistent, owner: data}

  # MLS-MPM dynamic-body grid BC handoff (per grid node) + the per-body reaction
  # diagnostic. grid_body_dp is the node momentum change the BC imposed; the owning
  # body global index lives in grid_body_owner (~0u when no body is in band). The
  # a stable owner sort exposes each body's exact node span; the per-body reaction
  # kernel gathers grid_body_dp in the original ascending node order (__fadd_rn) and
  # deposits into the body sink + sums the impulse into
  # mpm_body_reaction (the gate balance probe, NOT a behavior input). 0 nodes/bodies
  # for a non-MPM world -> zero-byte segments. APPENDED LAST.
  - {name: grid_body_dp,     dtype: vec3, per: scalar, count: "mpm_grid_nodes_per_env*env_count", arena: scratch, owner: data}
  - {name: grid_body_owner,  dtype: u32,  per: scalar, count: "mpm_grid_nodes_per_env*env_count", arena: scratch, owner: data}
  - {name: mpm_body_reaction, dtype: vec3, per: body, arena: scratch, owner: data, flags: [readout]}
  # Angular companion of mpm_body_reaction: the per-body grid->body torque impulse
  # the link-row gather sums, which the per-articulation deposit chain-walks into
  # qdot_flat. The free-rigid path applies its torque inline and leaves this zero.
  - {name: mpm_body_ang_reaction, dtype: vec3, per: body, arena: scratch, owner: data, flags: [readout]}

  # Joint dry friction is a per-link bound on the shared solver impulse divided by dt.
  - {name: joint_frictionloss, dtype: f32, per: link, arena: persistent, owner: model, flags: [param]}
  # A passive joint spring pulls a scalar joint toward its spring reference.
  - {name: joint_stiffness, dtype: f32, per: link, arena: persistent, owner: model}
  - {name: joint_spring_reference, dtype: f32, per: link, arena: persistent, owner: model}

  # =========================================================================
  # Per-body EXTRA-collidable owner binding (multi-collidable bodies/links). A body
  # row that is a COLLIDABLE PROXY carries its pose source plus the geom's
  # owner-local offset in body_collidable_local; SyncLinkBodyPose poses
  # body_pose[row] = owner_pose o local for it. The source is EITHER a
  # TEMPLATE-local articulation link (body_collidable_link) or a TEMPLATE-local
  # free-rigid body row (body_collidable_body); a non-proxy row carries ~0u in
  # both, so every single-collidable scene is a no-op -> byte-identical. APPENDED
  # LAST so every pre-existing arena offset is byte-stable.
  # =========================================================================
  - {name: body_collidable_link,  dtype: u32,       per: body, arena: persistent, owner: model}
  - {name: body_collidable_local, dtype: transform, per: body, arena: persistent, owner: model}
  - {name: body_collidable_body,  dtype: u32,       per: body, arena: persistent, owner: model}

  # Canonical contact identity for the shared narrowphase-to-solver boundary.
  - {name: ucontact_id_pair, dtype: u64, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: ucontact_id_feature, dtype: u64, per: contact_slot, arena: scratch, owner: data, elem: 4}

  # Contact warm-start state. Persistent across steps and explicitly cleared by
  # reset/restore; each contact point stores one normal and two signed tangential impulses
  # in the friction basis its cached normal defines.
  - {name: contact_cache_pair, dtype: u64, per: contact_slot, arena: persistent, owner: data, elem: 4}
  - {name: contact_cache_feature, dtype: u64, per: contact_slot, arena: persistent, owner: data, elem: 4}
  - {name: contact_cache_lambda, dtype: f32, per: contact_slot, arena: persistent, owner: data, elem: 16}
  - {name: contact_cache_normal, dtype: vec3, per: contact_slot, arena: persistent, owner: data, elem: 4}
  - {name: contact_cache_material, dtype: u64, per: contact_slot, arena: persistent, owner: data, elem: 4}
  - {name: contact_cache_age, dtype: u32, per: contact_slot, arena: persistent, owner: data, elem: 4}

  # Scratch snapshot and ownership masks for deterministic parallel cache rebuild.
  - {name: contact_cache_snapshot_pair, dtype: u64, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: contact_cache_snapshot_feature, dtype: u64, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: contact_cache_snapshot_lambda, dtype: f32, per: contact_slot, arena: scratch, owner: data, elem: 16}
  - {name: contact_cache_snapshot_normal, dtype: vec3, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: contact_cache_snapshot_material, dtype: u64, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: contact_cache_snapshot_age, dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: contact_cache_current_owner, dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}
  - {name: contact_cache_old_keep, dtype: u32, per: contact_slot, arena: scratch, owner: data, elem: 4}

  # Authored one-sided articulation bounds and independent solver telemetry.
  - {name: joint_limit_lower, dtype: f32, per: link, arena: persistent, owner: model, flags: [param]}
  - {name: joint_limit_upper, dtype: f32, per: link, arena: persistent, owner: model, flags: [param]}
  - {name: joint_limit_flags, dtype: u8,  per: link, arena: persistent, owner: model, flags: [param]}
  - {name: mimic_source_link, dtype: u32, per: link, arena: persistent, owner: model}
  - {name: mimic_multiplier, dtype: f32, per: link, arena: persistent, owner: model}
  - {name: mimic_offset, dtype: f32, per: link, arena: persistent, owner: model}
  - {name: joint_limit_impulse, dtype: f32, per: link, arena: scratch, owner: data, elem: 2, flags: [readout]}
  - {name: actuator_effort_requested, dtype: f32, per: link, arena: scratch, owner: data, flags: [readout]}
  - {name: actuator_effort, dtype: f32, per: link, arena: scratch, owner: data, flags: [readout]}
  - {name: actuator_saturated, dtype: f32, per: link, arena: scratch, owner: data, flags: [readout]}

  # Broadphase pair-stream canonicalization scratch: the cub radix sort inputs/
  # outputs (u64 global pair key -> u32 slot permutation) plus the pair snapshot
  # the scatter pass reads back, all sized at World construct so the sort never
  # cudaMallocs mid graph capture. Zero bytes for a non-PairDriven world ->
  # zero-byte segment (byte-inert). APPENDED LAST.
  - {name: pair_sort_scratch, dtype: u8, per: scalar, count: "pair_sort_scratch_bytes", arena: scratch, owner: data}

  # One task frame per articulation; a zero target quaternion selects position control.
  # A zero local quaternion denotes the identity rotation.
  - {name: task_target,          dtype: vec3,      per: articulation, arena: persistent, owner: data, flags: [param]}
  - {name: task_rotation_target, dtype: quat,      per: articulation, arena: persistent, owner: data, flags: [param]}
  - {name: task_local_pose,      dtype: transform, per: articulation, arena: persistent, owner: data, flags: [param]}

  # Body pose is the authored frame; linear and angular velocity are world COM quantities.
  # Principal inverse inertia is rotated into a symmetric world tensor before each solve.
  - {name: body_inertial_frame, dtype: transform, per: body, arena: persistent, owner: data, flags: [param]}
  - {name: body_world_inv_inertia, dtype: symmat3, per: body, arena: scratch, owner: data}

  # Velocities before forces: the normal contact acceleration reference and the energy ledger's interval start.
  - {name: step_qdot_flat, dtype: f32, per: articulation_dof, arena: scratch, owner: data}
  - {name: step_body_linear_velocity, dtype: vec3, per: body, arena: scratch, owner: data}
  - {name: step_body_angular_velocity, dtype: vec3, per: body, arena: scratch, owner: data}
  - {name: step_particle_velocity, dtype: vec3, per: particle, arena: scratch, owner: data}

  # Contact reaction owners: world body, world link, or world particle index by kind.
  - {name: contact_side_a_kind, dtype: u32, per: contact_slot, arena: scratch, owner: data, flags: [readout]}
  - {name: contact_side_b_kind, dtype: u32, per: contact_slot, arena: scratch, owner: data, flags: [readout]}
  - {name: contact_side_a_index, dtype: u32, per: contact_slot, arena: scratch, owner: data, flags: [readout]}
  - {name: contact_side_b_index, dtype: u32, per: contact_slot, arena: scratch, owner: data, flags: [readout]}

  # Fixed-order face adjacency and one impulse per aerodynamic triangle.
  - {name: aero_particle_offset, dtype: u32, per: particle, arena: persistent, owner: model}
  - {name: aero_particle_count, dtype: u32, per: particle, arena: persistent, owner: model}
  - {name: aero_incident_tri, dtype: u32, per: aero_tri, arena: persistent, owner: model, elem: 3}
  - {name: aero_tri_impulse, dtype: vec3, per: aero_tri, arena: scratch, owner: data}

  # Last free-body drift diagnostics; reset clears selected environments.
  - {name: body_gyro_residual, dtype: f32, per: body, arena: scratch, owner: data, flags: [readout]}
  - {name: body_gyro_iterations, dtype: u32, per: body, arena: scratch, owner: data, flags: [readout]}
  - {name: body_gyro_status, dtype: u32, per: body, arena: scratch, owner: data, flags: [readout]}

  - {name: lbvh_sort_scratch, dtype: u8, per: scalar, count: "lbvh_sort_scratch_bytes", arena: scratch, owner: data}
  - {name: contact_cache_scratch, dtype: u8, per: scalar, count: "contact_cache_scratch_bytes", arena: scratch, owner: data}

  # Stable active rows and sorted link endpoints are distinct from solver row identity.
  - {name: active_row_ids, dtype: u32, per: row_slot, arena: scratch, owner: data}
  - {name: active_row_count, dtype: u32, per: env, arena: scratch, owner: data}
  - {name: contact_endpoint_keys, dtype: u64, per: row_slot, elem: 2, arena: scratch, owner: data}
  - {name: contact_endpoint_count, dtype: u32, per: env, arena: scratch, owner: data}
  - {name: link_contact_begin, dtype: u32, per: link, arena: scratch, owner: data}
  - {name: link_contact_end, dtype: u32, per: link, arena: scratch, owner: data}
  - {name: contact_index_scratch, dtype: u8, per: scalar, count: "contact_index_scratch_bytes", arena: scratch, owner: data}

  # Mesh topology is shared by all environments and indexed by collidable.
  - {name: mesh_surface_info, dtype: mesh_surface_info, per: scalar, count: "mesh_surface_info_count", arena: persistent, owner: model}
  - {name: mesh_triangles, dtype: u32, per: scalar, count: "max_mesh_triangles*3", arena: persistent, owner: model}
  - {name: mesh_bvh_nodes, dtype: mesh_bvh_node, per: scalar, count: "max_mesh_bvh_nodes", arena: persistent, owner: model}
  - {name: mesh_edge_info, dtype: mesh_edge_info, per: scalar, count: "mesh_surface_info_count", arena: persistent, owner: model}
  - {name: mesh_edges, dtype: mesh_edge, per: scalar, count: "max_mesh_edges", arena: persistent, owner: model}
  - {name: mesh_edge_nodes, dtype: mesh_bvh_node, per: scalar, count: "max_mesh_edge_nodes", arena: persistent, owner: model}
  - {name: mesh_triangle_edges, dtype: u32, per: scalar, count: "max_mesh_triangles*3", arena: persistent, owner: model}
  - {name: mesh_triangle_vertex_owner, dtype: u32, per: scalar, count: "max_mesh_triangles*3", arena: persistent, owner: model}
  # Vertex incidence over hull vertices: global edge << 1 | side and global triangle << 2 | corner.
  - {name: mesh_vertex_edge_offsets, dtype: u32, per: scalar, count: "max_hull_verts+1", arena: persistent, owner: model}
  - {name: mesh_vertex_edges, dtype: u32, per: scalar, count: "max_mesh_edges*2", arena: persistent, owner: model}
  - {name: mesh_vertex_triangle_offsets, dtype: u32, per: scalar, count: "max_hull_verts+1", arena: persistent, owner: model}
  - {name: mesh_vertex_triangles, dtype: u32, per: scalar, count: "max_mesh_triangles*3", arena: persistent, owner: model}
  - {name: mesh_vertex_sources, dtype: u64, per: scalar, count: "mesh_vertex_source_count", arena: persistent, owner: model}
  - {name: mesh_edge_sources, dtype: u64, per: scalar, count: "mesh_edge_source_count", arena: persistent, owner: model}
  - {name: mesh_contact_mode, dtype: u8, per: scalar, count: "max_bodies_total", arena: persistent, owner: model}
  # Largest distance of a collidable's mesh vertices from its origin.
  - {name: mesh_vertex_reach, dtype: f32, per: scalar, count: "mesh_surface_info_count", arena: persistent, owner: model}

  # Outer-step impulses use world-origin moments until the final reference-point shift.
  - {name: step_env_status, dtype: u32, per: env, arena: scratch, owner: data}
  - {name: step_mpm_body_impulse, dtype: vec3, per: body, arena: scratch, owner: data}
  - {name: step_mpm_body_moment, dtype: vec3, per: body, arena: scratch, owner: data}
  - {name: step_link_impulse, dtype: vec3, per: link, arena: scratch, owner: data}
  - {name: step_link_moment, dtype: vec3, per: link, arena: scratch, owner: data}
  - {name: step_joint_limit_impulse, dtype: f32, per: link, arena: scratch, owner: data, elem: 2}

  # Multiplicative plastic deformation is present when a material requires its history.
  - {name: particle_plastic_F, dtype: f32, per: particle, arena: persistent, owner: data, elem: 9}
  - {name: snapshot_particle_plastic_F, dtype: f32, per: particle, arena: persistent, owner: data, elem: 9}

  # Finite grid endpoints and deterministic contact compaction.
  - {name: grid_inv_mass, dtype: f32, per: scalar, count: "mpm_grid_nodes_per_env*env_count", arena: scratch, owner: data}
  - {name: grid_contact_count, dtype: u64, per: scalar, count: "particles_per_env*env_count", arena: scratch, owner: data}
  - {name: grid_contact_offset, dtype: u64, per: scalar, count: "particles_per_env*env_count", arena: scratch, owner: data}
  - {name: ucontact_law, dtype: u32, per: contact_slot, arena: scratch, owner: data}
  - {name: ucontact_friction, dtype: f32, per: contact_slot, arena: scratch, owner: data}

