# CLA Assistant — gates pull requests on a signed Contributor License Agreement.
#
# This uses the cla-assistant.io GitHub Action (contributor-assistant/github-action).
# It records signatures in a JSON file committed to this repository and blocks
# merge until the PR author has signed the CLA in CLA.md.
#
# OWNER ACTION REQUIRED before this is active:
#   1. Enable GitHub Actions for the repository (Settings -> Actions).
#   2. Ensure the workflow has write permissions (Settings -> Actions -> General
#      -> Workflow permissions: "Read and write permissions"), OR rely on the
#      explicit `permissions:` block below.
#   3. (Only if storing signatures in a SEPARATE/remote repo) create a
#      `PERSONAL_ACCESS_TOKEN` repository secret with `repo` scope and uncomment
#      the env line below. For same-repo storage (the default here), the built-in
#      GITHUB_TOKEN is sufficient — no secret needs to be created.
#   4. Update `path-to-document` below to point at CLA.md on the default branch
#      once the repository's public URL is known.
#
# The CLA document contributors sign is: CLA.md (in this repository).

name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Explicit permissions in case the repo default GITHUB_TOKEN is read-only.
permissions:
  actions: write
  contents: write # may be 'read' if signatures are stored in a remote repository
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if signatures are stored in a remote repository/org:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          # Where signatures are recorded (committed to this repo).
          path-to-signatures: 'signatures/version1/cla.json'
          # The CLA document contributors must sign. Update the URL to point at
          # CLA.md on the default branch once the public repo URL is known.
          path-to-document: 'https://github.com/kry4r/Nuka-Physics/blob/master/CLA.md'
          # Branch where signatures are committed — must NOT be a protected branch.
          branch: 'cla-signatures'
          # Bot accounts that never need to sign.
          allowlist: dependabot[bot],bot*
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thank you for your contribution to Nuka Physics. Before we can merge, please sign the [Contributor License Agreement](CLA.md) by posting the comment below.'
